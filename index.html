    const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
    const floorTo = (v, unit = 10) => Math.floor(num(v) / unit + 1e-9) * unit;
    const lim = (l) => (l === null || l === undefined ? Infinity : l);
    const pctText = (x, d = 4) => `${parseFloat((num(x) * 100).toFixed(d))}%`;

    function unitText(n) {
      n = Math.round(num(n));
      if (n >= 100000000) {
        const eok = Math.floor(n / 100000000);
        const man = Math.round((n % 100000000) / 10000);
        return man ? `${eok.toLocaleString()}억 ${man.toLocaleString()}만원` : `${eok.toLocaleString()}억원`;
      }
      if (n >= 10000) return `${Math.round(n / 10000).toLocaleString()}만원`;
      return `${n.toLocaleString()}원`;
    }

    // 초과누진세율(과세표준 × 세율 − 누진공제)
    function bracketTax(brackets, base) {
      const b = Math.max(0, Math.floor(num(base)));
      if (b === 0) return { tax: 0, rate: brackets[0].rate, deduction: 0, index: 0 };
      for (let i = 0; i < brackets.length; i++) {
        if (b <= lim(brackets[i].limit)) {
          return {
            tax: Math.max(0, Math.floor(b * brackets[i].rate - brackets[i].deduction)),
            rate: brackets[i].rate,
            deduction: brackets[i].deduction,
            index: i
          };
        }
      }
      const last = brackets[brackets.length - 1];
      return { tax: Math.max(0, Math.floor(b * last.rate - last.deduction)), rate: last.rate, deduction: last.deduction, index: brackets.length - 1 };
    }

    // 구간 기준 + 누적액 방식(근로소득공제, 환산급여공제)
    function tierValue(tiers, x) {
      const v = Math.max(0, num(x));
      for (let i = 0; i < tiers.length; i++) {
        if (v <= lim(tiers[i].upTo)) return tiers[i].base + (v - tiers[i].from) * tiers[i].rate;
      }
      const t = tiers[tiers.length - 1];
      return t.base + (v - t.from) * t.rate;
    }

    // ---------- 4대보험 ----------
    function calcInsurance(cfg, pay) {
      const i = cfg.insurance;
      const p = Math.max(0, num(pay));
      if (p === 0) return { npBase: 0, pension: 0, health: 0, ltc: 0, employment: 0, total: 0 };
      const npBase = Math.floor(Math.min(Math.max(p, i.pension.lower), i.pension.upper) / 1000) * 1000;
      const pension = floorTo(npBase * (i.pension.rate / 2), 10);
      const health = floorTo(p * (i.health.rate / 2), 10);
      const ltc = floorTo(health * i.health.ltcRate, 10);
      const employment = floorTo(p * i.employment.employeeRate, 10);
      return { npBase, pension, health, ltc, employment, total: pension + health + ltc + employment };
    }

    function calcEmployerInsurance(cfg, pay, stabilityRate, industrialRate) {
      const i = cfg.insurance;
      const p = Math.max(0, num(pay));
      if (p === 0) return { pension: 0, health: 0, ltc: 0, employment: 0, industrial: 0, total: 0 };
      const emp = calcInsurance(cfg, p);
      const employment = floorTo(p * (i.employment.employerBase + num(stabilityRate)), 10);
      const industrial = floorTo(p * num(industrialRate), 10);
      return {
        pension: emp.pension, health: emp.health, ltc: emp.ltc, employment, industrial,
        total: emp.pension + emp.health + emp.ltc + employment + industrial
      };
    }

    // ---------- 근로소득세(간이세액표 산식 추정) ----------
    function earnedCreditCap(cfg, gross) {
      const c = cfg.earned.creditCap;
      if (gross <= c.t1.gross) return c.t1.cap;
      if (gross <= c.t2.gross) return Math.max(c.t2.floor, c.t1.cap - (gross - c.t1.gross) * c.t2.rate);
      if (gross <= c.t3.gross) return Math.max(c.t3.floor, c.t2.floor - (gross - c.t2.gross) * c.t3.rate);
      return Math.max(c.t4.floor, c.t3.floor - (gross - c.t3.gross) * c.t4.rate);
    }

    function childCreditAnnual(cfg, n) {
      const c = cfg.earned.childCredit;
      if (n <= 0) return 0;
      if (n === 1) return c.one;
      if (n === 2) return c.two;
      return c.two + (n - 2) * c.extra;
    }

    function earnedTaxMonthly(cfg, monthlyTaxablePay, family, kids, ratio = 1) {
      const e = cfg.earned;
      const pay = Math.max(0, num(monthlyTaxablePay));
      const annualGross = pay * 12;
      const ins = calcInsurance(cfg, pay);
      const deduction = Math.min(e.incomeDeductionMax, Math.floor(tierValue(e.incomeDeduction, annualGross)));
      const income = Math.max(0, annualGross - deduction);
      const personal = e.basicPerPerson * Math.max(1, Math.floor(num(family)));
      const pensionDed = ins.pension * 12;
      const specialDed = (ins.health + ins.ltc + ins.employment) * 12;
      const base = Math.max(0, income - personal - pensionDed - specialDed);
      const calcTax = bracketTax(cfg.incomeTax.brackets, base).tax;
      const cr = e.credit;
      const rawCredit = calcTax <= cr.lowLimit ? calcTax * cr.lowRate : cr.highBase + (calcTax - cr.lowLimit) * cr.highRate;
      const credit = Math.floor(Math.min(rawCredit, earnedCreditCap(cfg, annualGross)));
      const childCredit = childCreditAnnual(cfg, Math.floor(num(kids)));
      const annual = Math.max(0, calcTax - credit - childCredit - e.standardCredit);
      const monthly = floorTo((annual / 12) * ratio, 10);
      const local = floorTo(monthly * cfg.incomeTax.localRate, 10);
      return { annualGross, deduction, income, personal, base, calcTax, credit, childCredit, annual, monthly, local, ins };
    }

    // ---------- 최저임금·근로수당 ----------
    function monthlyPaidHours(weeklyHours) {
      const w = Math.max(0, num(weeklyHours));
      const holiday = w >= 15 ? (Math.min(w, 40) / 40) * 8 : 0;
      return { holiday, monthly: Math.round((w + holiday) * 365 / 7 / 12) };
    }

    // ---------- 퇴직 ----------
    function serviceDeduction(cfg, years) {
      const tiers = cfg.severance.serviceDeduction;
      for (let i = 0; i < tiers.length; i++) {
        if (years <= lim(tiers[i].upTo)) return tiers[i].base + (years - tiers[i].from) * tiers[i].per;
      }
      const t = tiers[tiers.length - 1];
      return t.base + (years - t.from) * t.per;
    }

    function severanceTax(cfg, pay, years) {
      const y = Math.max(1, Math.floor(num(years)));
      const sd = Math.floor(serviceDeduction(cfg, y));
      const afterSd = Math.max(0, num(pay) - sd);
      const converted = Math.floor((afterSd * 12) / y);
      const cd = Math.floor(tierValue(cfg.severance.convertedDeduction, converted));
      const base = Math.max(0, converted - cd);
      const br = bracketTax(cfg.incomeTax.brackets, base);
      const tax = Math.floor((br.tax / 12) * y);
      const local = Math.floor(tax * cfg.incomeTax.localRate);
      return { years: y, serviceDeduction: sd, converted, convertedDeduction: cd, base, rate: br.rate, convertedTax: br.tax, tax, local, total: tax + local };
    }

    function parseDate(s) {
      const d = new Date(`${s}T00:00:00`);
      return Number.isNaN(d.getTime()) ? null : d;
    }
    function addDays(d, n) { const r = new Date(d.getTime()); r.setDate(r.getDate() + n); return r; }
    function dayDiff(a, b) { return Math.round((b.getTime() - a.getTime()) / 86400000); }

    // 근속연수: 1년 미만의 기간은 1년으로 올림
    function serviceYears(startStr, endStr) {
      const s = parseDate(startStr), e = parseDate(endStr);
      if (!s || !e || e < s) return { days: 0, years: 0 };
      const endEx = addDays(e, 1);
      let y = endEx.getFullYear() - s.getFullYear();
      const ann = (n) => { const d = new Date(s.getTime()); d.setFullYear(s.getFullYear() + n); return d; };
      while (y > 0 && ann(y) > endEx) y--;
      const years = endEx > ann(y) ? y + 1 : y;
      return { days: dayDiff(s, endEx), years: Math.max(1, years) };
    }

    // ---------- 양도소득세 ----------
    function capitalGainsTax(cfg, p) {
      const c = cfg.capitalGains;
      const sale = num(p.sale), buy = num(p.buy), exp = num(p.expense);
      const hold = Math.max(0, num(p.holdYears)), live = Math.max(0, num(p.liveYears));
      let gain = sale - buy - exp;
      const out = { gain: Math.max(0, gain), taxableGain: 0, ltd: 0, ltdRate: 0, base: 0, rate: 0, tax: 0, local: 0, total: 0, mode: '', exempt: false, note: '' };
      if (gain <= 0) { out.mode = '양도차익 없음'; return out; }
      let single = false;
      if (p.type === 'house' && p.singleHome) {
        if (sale <= c.singleHomeExempt) { out.exempt = true; out.mode = '1세대 1주택 비과세'; return out; }
        gain = Math.floor(gain * ((sale - c.singleHomeExempt) / sale));
        single = true;
      }
      out.taxableGain = gain;
      const shortList = c.shortTerm[p.type] || [];
      const shortRule = shortList.find((r) => hold < r.underYears);
      let ltdRate = 0;
      if (!shortRule && p.type !== 'presale') {
        if (single) {
          const h = c.ltd.singleHold, l = c.ltd.singleLive;
          const hr = hold >= h.minYears ? Math.min(h.max, Math.floor(hold) * h.perYear) : 0;
          const lr = live >= l.minYears ? Math.min(l.max, Math.floor(live) * l.perYear) : 0;
          ltdRate = hr + lr;
        } else {
          const g = c.ltd.general;
          ltdRate = hold >= g.minYears ? Math.min(g.max, Math.floor(hold) * g.perYear) : 0;
        }
      }
      const ltd = Math.floor(gain * ltdRate);
      const base = Math.max(0, gain - ltd - c.basicDeduction);
      out.ltd = ltd; out.ltdRate = ltdRate; out.base = base;
      let tax = 0;
      if (shortRule) {
        const flat = Math.floor(base * shortRule.rate);
        if (p.type === 'presale') { tax = flat; out.mode = `단기 양도 단일세율 ${pctText(shortRule.rate, 0)}`; out.rate = shortRule.rate; }
        else {
          const basic = bracketTax(cfg.incomeTax.brackets, base).tax;
          tax = Math.max(flat, basic);
          out.mode = `단기 양도 ${pctText(shortRule.rate, 0)} (기본세율과 비교하여 큰 금액)`; out.rate = shortRule.rate;
        }
      } else {
        const br = bracketTax(cfg.incomeTax.brackets, base);
        tax = br.tax; out.rate = br.rate;
        out.mode = single ? '고가주택(12억 초과분) 기본세율' : '기본세율';
      }
      out.tax = tax;
      out.local = Math.floor(tax * c.localRate);
      out.total = out.tax + out.local;
      return out;
    }

    // ---------- 주식 ----------
    function stockTax(cfg, p) {
      const s = cfg.stock;
      const gain = num(p.gain);
      if (p.kind === 'overseas') {
        const base = Math.max(0, gain - s.overseas.basic);
        const tax = Math.floor(base * s.overseas.rate);
        const local = Math.floor(tax * s.localRate);
        return { base, tax, local, total: tax + local, taxable: true, note: '' };
      }
      if (num(p.holding) < s.major.threshold) {
        return { base: 0, tax: 0, local: 0, total: 0, taxable: false, note: `종목당 보유금액이 대주주 기준(${unitText(s.major.threshold)}) 미만이면 국내 상장주식 양도차익은 과세되지 않습니다.` };
      }
      const base = Math.max(0, gain - s.major.basic);
      let tax = 0, prev = 0;
      for (let i = 0; i < s.major.tiers.length; i++) {
        const up = lim(s.major.tiers[i].upTo);
        const part = Math.max(0, Math.min(base, up) - prev);
        tax += part * s.major.tiers[i].rate;
        prev = up;
        if (base <= up) break;
      }
      tax = Math.floor(tax);
      const local = Math.floor(tax * s.localRate);
      return { base, tax, local, total: tax + local, taxable: true, note: '' };
    }

    // ---------- 금융소득종합과세(비교과세) ----------
    function financialGlobalTax(cfg, p) {
      const f = cfg.financial;
      const interest = Math.max(0, num(p.interest)), dividend = Math.max(0, num(p.dividend)), other = Math.max(0, num(p.otherBase));
      const F = interest + dividend;
      if (F <= f.threshold) {
        const tax = Math.floor(F * f.withholdingRate);
        const local = Math.floor(tax * f.localRate);
        return { F, comprehensive: false, tax, local, total: tax + local, A: 0, B: 0, grossUp: 0, credit: 0, mode: '원천징수 분리과세(종결)' };
      }
      const br = cfg.incomeTax.brackets;
      const excess = F - f.threshold;
      const grossUp = Math.floor(Math.min(dividend, excess) * f.grossUp);
      const taxWith = bracketTax(br, other + excess + grossUp).tax;
      const taxOther = bracketTax(br, other).tax;
      const A = Math.floor(f.threshold * f.withholdingRate) + taxWith;
      const B = Math.floor(F * f.withholdingRate) + taxOther;
      const credit = Math.min(grossUp, Math.max(0, A - B));
      const tax = Math.max(A, B) - credit;
      const local = Math.floor(tax * f.localRate);
      return { F, comprehensive: true, tax, local, total: tax + local, A, B, grossUp, credit, mode: A >= B ? '종합과세 산출세액(①) 적용' : '비교산출세액(②) 적용' };
    }

    function pensionRate(cfg, age) {
      let r = cfg.pension.ageRates[0].rate;
      cfg.pension.ageRates.forEach((a) => { if (age >= a.minAge) r = a.rate; });
      return r;
    }

    function dailyWorkerTax(cfg, daily) {
      const d = cfg.earned.dailyWorker;
      const taxable = Math.max(0, num(daily) - d.deduction);
      let tax = Math.floor(taxable * d.rate * (1 - d.creditRate));
      if (tax < d.minTax) tax = 0;
      const local = floorTo(tax * cfg.incomeTax.localRate, 1);
      return { taxable, tax, local, total: tax + local };
    }
    /*PURE_END*/

    /* ---------------- 요율표 로딩 / 컨텍스트 ---------------- */
    function deepMerge(base, patch) {
      if (Array.isArray(patch) || patch === null || typeof patch !== 'object') return patch === undefined ? base : patch;
      const out = Array.isArray(base) ? base.slice() : { ...base };
      Object.keys(patch).forEach((k) => {
        const b = base && typeof base === 'object' ? base[k] : undefined;
        out[k] = b !== null && typeof b === 'object' && !Array.isArray(b) && typeof patch[k] === 'object' && patch[k] !== null && !Array.isArray(patch[k])
          ? deepMerge(b, patch[k])
          : patch[k];
      });
      return out;
    }

    function isValidConfig(c) {
      try {
        const okRate = (x) => typeof x === 'number' && x >= 0 && x <= 1;
        return !!c
          && typeof c.asOf === 'string'
          && okRate(c.insurance.pension.rate) && okRate(c.insurance.health.rate) && okRate(c.insurance.health.ltcRate)
          && okRate(c.insurance.employment.employeeRate)
          && c.insurance.pension.upper > c.insurance.pension.lower
          && Array.isArray(c.incomeTax.brackets) && c.incomeTax.brackets.length >= 1
          && Array.isArray(c.corporate.brackets) && c.corporate.brackets.length >= 1
          && c.minWage.hourly > 0;
      } catch (err) {
        return false;
      }
    }

    const RatesContext = createContext({ cfg: DEFAULT_TAX_CONFIG, status: { state: 'default', source: '내장 기준값' }, reload: () => {} });
    const useCfg = () => useContext(RatesContext).cfg;
    const useRates = () => useContext(RatesContext);

    function RatesProvider({ children }) {
      const [cfg, setCfg] = useState(DEFAULT_TAX_CONFIG);
      const [status, setStatus] = useState({ state: 'loading', source: '요율표 확인 중' });

      const load = async () => {
        setStatus({ state: 'loading', source: '요율표 확인 중' });
        let best = DEFAULT_TAX_CONFIG;
        let state = 'default';
        let source = '내장 기준값';
        try {
          const cached = JSON.parse(localStorage.getItem(RATES_CACHE_KEY) || 'null');
          if (cached && isValidConfig(cached) && cached.asOf > best.asOf) {
            best = deepMerge(DEFAULT_TAX_CONFIG, cached); state = 'cache'; source = '이전에 받은 요율표(저장본)';
          }
        } catch (err) { /* 저장소 접근 불가 시 무시 */ }
        for (const url of RATES_URLS) {
          try {
            const res = await fetch(`${url}${url.includes('?') ? '&' : '?'}t=${Date.now()}`, { cache: 'no-store' });
            if (!res.ok) continue;
            const json = await res.json();
            const merged = deepMerge(DEFAULT_TAX_CONFIG, json);
            if (isValidConfig(merged) && merged.asOf >= best.asOf) {
              best = merged; state = 'remote'; source = `원격 요율표(${url})`;
              try { localStorage.setItem(RATES_CACHE_KEY, JSON.stringify(json)); } catch (err) { /* 무시 */ }
              break;
            }
          } catch (err) { /* 네트워크 오류 시 다음 후보 */ }
        }
        setCfg(best);
        setStatus({ state, source });
      };

      useEffect(() => { load(); }, []);

      return (
        <RatesContext.Provider value={{ cfg, status, reload: load }}>
          {children}
        </RatesContext.Provider>
      );
    }

    /* ============ 근로·급여 계열 ============ */
    function SalaryDetailCalc({ calcId }) {
      const cfg = useCfg();
      const isMonthly = calcId === 'monthly_salary';
      const currentTitle = `${cfg.year}년 ${isMonthly ? '월급' : '연봉'} 실수령액 정밀 계산기`;
      const [salaryType, setSalaryType] = useState(isMonthly ? 'month' : 'year');
      const [amount, setAmount] = useState(isMonthly ? 4000000 : 48000000);
      const [nonTax, setNonTax] = useState(cfg.earned.nonTaxable.meal);
      const [familyCount, setFamilyCount] = useState(1);
      const [childCount, setChildCount] = useState(0);

      const switchType = (t) => {
        if (t === salaryType) return;
        setAmount(t === 'month' ? Math.round(amount / 12 / 10000) * 10000 : amount * 12);
        setSalaryType(t);
      };

      const gross = salaryType === 'year' ? Math.floor(amount / 12) : amount;
      const nonTaxEff = Math.min(Math.max(0, nonTax), gross);
      const taxablePay = gross - nonTaxEff;
      const kids = Math.min(Math.max(0, childCount), Math.max(0, familyCount - 1));
      const ins = calcInsurance(cfg, taxablePay);
      const et = earnedTaxMonthly(cfg, taxablePay, familyCount, kids);
      const totalDeduction = ins.total + et.monthly + et.local;
      const netPay = gross - totalDeduction;
      const i = cfg.insurance;

      return (
        <div className="space-y-6 rounded-2xl bg-slate-900 text-white shadow-md border border-slate-800 p-5 sm:p-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-800">
            <div>
              <h3 className="text-base font-bold text-white">{currentTitle}</h3>
              <p className="text-xs text-slate-400 mt-0.5">부양가족 및 {cfg.year}년 4대보험 요율·근로소득 산식을 1원 단위까지 산출합니다.</p>
            </div>
            <div className="flex items-center gap-1 bg-slate-800/80 p-1 rounded-lg text-xs font-semibold border border-slate-700">
              <button onClick={() => switchType('year')} className={`px-3 py-1 rounded-md ${salaryType === 'year' ? 'bg-blue-600 text-white shadow-2xs font-bold' : 'text-slate-400 hover:text-white'}`}>연봉 기준</button>
              <button onClick={() => switchType('month')} className={`px-3 py-1 rounded-md ${salaryType === 'month' ? 'bg-blue-600 text-white shadow-2xs font-bold' : 'text-slate-400 hover:text-white'}`}>월급 기준</button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-5 items-center">
            <div className="space-y-4 text-xs bg-slate-800/60 p-4 rounded-xl border border-slate-700/60">
              <Field label={salaryType === 'year' ? '세전 희망 연봉 (원)' : '세전 월 기본급 (원)'} labelClassName="!text-slate-300">
                <input
                  type="number"
                  step="100000"
                  value={amount}
                  onChange={(e) => setAmount(Number(e.target.value))}
                  className="w-full bg-slate-950 text-white placeholder:text-slate-500 px-3.5 py-2.5 text-sm font-bold font-mono border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30"
                />
              </Field>

              <div className="grid grid-cols-3 gap-3">
                <Field label="월 비과세액" labelClassName="!text-slate-300" hint="식대·자가운전보조금·보육수당은 각각 월 20만원 한도">
                  <NumInput value={nonTax} onChange={setNonTax} step={10000} min={0} className="!bg-slate-950 !text-white !border-slate-700 focus:!border-blue-500" />
                </Field>
                <Field label="부양가족(본인포함)" labelClassName="!text-slate-300">
                  <NumInput value={familyCount} onChange={(v) => setFamilyCount(Math.max(1, v))} min={1} className="!bg-slate-950 !text-white !border-slate-700 focus:!border-blue-500" />
                </Field>
                <Field label="8~20세 자녀" labelClassName="!text-slate-300">
                  <NumInput value={childCount} onChange={(v) => setChildCount(Math.max(0, v))} min={0} className="!bg-slate-950 !text-white !border-slate-700 focus:!border-blue-500" />
                </Field>
              </div>
              <p className="text-[11px] text-slate-400 leading-relaxed">
                국민연금은 기준소득월액 {unitText(i.pension.lower)}~{unitText(i.pension.upper)} 범위({i.pension.validFrom}~{i.pension.validTo} 적용)에서 부과됩니다.
              </p>
            </div>

            <ResultPanel title="예상 월 통장 실수령액" big={`${formatCurrency(netPay)}원`} tone="white">
              <Row label="월 환산 총 급여:" value={`${formatCurrency(gross)}원`} />
              <Row label="비과세 제외 과세급여:" value={`${formatCurrency(taxablePay)}원`} />
              <Row label={`국민연금 (${pctText(i.pension.rate / 2)}):`} value={`${formatCurrency(ins.pension)}원`} />
              <Row label={`건강보험 (${pctText(i.health.rate / 2)}):`} value={`${formatCurrency(ins.health)}원`} />
              <Row label={`노인장기요양 (건보료의 ${pctText(i.health.ltcRate, 2)}):`} value={`${formatCurrency(ins.ltc)}원`} />
              <Row label={`고용보험 (${pctText(i.employment.employeeRate)}):`} value={`${formatCurrency(ins.employment)}원`} />
              <Row label="근로소득세 (간이세액 추정):" value={`${formatCurrency(et.monthly)}원`} />
              <Row label="지방소득세:" value={`${formatCurrency(et.local)}원`} />
              <Row label="총 공제 합계액:" value={`${formatCurrency(totalDeduction)}원`} strong tone="red" />
            </ResultPanel>
          </div>
          <p className="text-[11px] text-slate-400 leading-relaxed border-t border-slate-800 pt-3">
            * 근로소득세는 소득세법상 근로소득공제·인적공제·보험료공제·근로소득세액공제·자녀세액공제·표준세액공제를 적용해 산출한 추정치로,
            국세청 근로소득 간이세액표(홈택스 &gt; 나의 월급에서 한 달에 납부하는 세금은?)와 다소 차이가 있을 수 있습니다. 적용 기준일 {cfg.asOf}.
          </p>
        </div>
      );
    }

        <CalcShell
          title={`${cfg.year}년 근로소득세 계산기 (간이세액 산식)`}
          subtitle="월 급여액(비과세 제외)과 공제대상 가족 수로 매월 원천징수되는 소득세·지방소득세를 추정합니다."

                <Field label="8~20세 자녀 수"><NumInput value={kids} onChange={(v) => setKids(Math.max(0, v))} min={0} /></Field>
              </div>
              <Field label="원천징수 비율" hint="근로자는 간이세액표 세액의 80%·100%·120% 중 선택할 수 있습니다.">
                <select value={ratio} onChange={(e) => setRatio(Number(e.target.value))} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm">
                  <option value={0.8}>80%</option>
                  <option value={1}>100% (기본)</option>
                  <option value={1.2}>120%</option>
                </select>

            <ResultPanel title="월 원천징수 세액" big={`${formatCurrency(et.monthly + et.local)}원`}>

    function HourlyWageCalc() {
      const cfg = useCfg();
      const [hourly, setHourly] = useState(cfg.minWage.hourly);
      const [weekly, setWeekly] = useState(40);
      const [days, setDays] = useState(5);
      const h = monthlyPaidHours(weekly);
      const dailyHours = days > 0 ? weekly / days : 0;
      const weeklyHolidayPay = Math.floor(hourly * h.holiday);
      const weeklyPay = Math.floor(hourly * weekly) + weeklyHolidayPay;
      const monthly = Math.floor(hourly * h.monthly);
      const minMonthly = cfg.minWage.hourly * h.monthly;

      return (
        <CalcShell
          title={`${cfg.year}년 최저시급(${formatCurrency(cfg.minWage.hourly)}원) 기준 일급·주급·월급 환산기`}
          subtitle="시급과 소정근로시간으로 일급, 주휴수당 포함 주급, 월 환산 급여를 계산합니다."
        >
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-4 text-xs">
              <Field label="시급 (원)"><NumInput value={hourly} onChange={setHourly} step={10} min={0} /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="주 소정근로시간"><NumInput value={weekly} onChange={setWeekly} min={0} /></Field>
                <Field label="주 근무일수"><NumInput value={days} onChange={(v) => setDays(Math.max(1, v))} min={1} /></Field>
              </div>
              <p className="text-[11px] text-slate-400 leading-relaxed">
                주 15시간 이상 근무하고 소정근로일을 개근하면 주휴수당이 발생합니다. 월 환산시간 = (주 소정근로시간 + 주휴시간) × 365 ÷ 7 ÷ 12 (주 40시간 = {cfg.minWage.monthlyHours}시간).
              </p>
              {hourly < cfg.minWage.hourly && (
                <p className="text-[11px] font-bold text-rose-600">입력한 시급이 {cfg.year}년 최저임금({formatCurrency(cfg.minWage.hourly)}원)보다 낮습니다.</p>
              )}
            </div>
            <ResultPanel title="월 환산 급여 (세전)" big={`${formatCurrency(monthly)}원`}>
              <Row label="일급:" value={`${formatCurrency(Math.floor(hourly * dailyHours))}원`} />
              <Row label="주급 (주휴수당 포함):" value={`${formatCurrency(weeklyPay)}원`} />
              <Row label="  └ 주휴수당(주):" value={`${formatCurrency(weeklyHolidayPay)}원`} />
              <Row label="월 환산 유급시간:" value={`${h.monthly}시간`} />
              <Row label={`${cfg.year}년 최저임금 월 환산액:`} value={`${formatCurrency(minMonthly)}원`} />
            </ResultPanel>
          </div>
        </CalcShell>
      );
    }

    function WorkAllowanceCalc() {
      const cfg = useCfg();
      const [hourly, setHourly] = useState(cfg.minWage.hourly);
      const [weekly, setWeekly] = useState(40);
      const [over5, setOver5] = useState(true);
      const [ext, setExt] = useState(10);
      const [night, setNight] = useState(0);
      const [hol8, setHol8] = useState(0);
      const [holOver, setHolOver] = useState(0);
      const h = monthlyPaidHours(weekly);
      const weeks = 365 / 7 / 12;
      const holidayPay = Math.floor(hourly * h.holiday * weeks);
      const extPay = Math.floor(hourly * ext * (over5 ? 1.5 : 1));
      const nightPay = Math.floor(hourly * night * (over5 ? 0.5 : 0));
      const hol8Pay = Math.floor(hourly * hol8 * (over5 ? 1.5 : 1));
      const holOverPay = Math.floor(hourly * holOver * (over5 ? 2 : 1));
      const base = Math.floor(hourly * weekly * weeks);
      const total = base + holidayPay + extPay + nightPay + hol8Pay + holOverPay;

      return (
        <CalcShell
          title={`${cfg.year}년 근로수당 (주휴수당·연장·야간·휴일근로 가산) 계산기`}
          subtitle="상시근로자 5인 이상 사업장은 연장·야간·휴일근로에 가산임금(50%·100%)이 적용됩니다."
        >
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-4 text-xs">
              <div className="grid grid-cols-2 gap-3">
                <Field label="시급 (원)"><NumInput value={hourly} onChange={setHourly} step={10} min={0} /></Field>
                <Field label="주 소정근로시간"><NumInput value={weekly} onChange={setWeekly} min={0} /></Field>
              </div>
              <label className="flex items-center gap-2 text-slate-700 font-semibold">
                <input type="checkbox" checked={over5} onChange={(e) => setOver5(e.target.checked)} />
                상시근로자 5인 이상 사업장 (가산수당 적용)
              </label>
              <div className="grid grid-cols-2 gap-3">
                <Field label="월 연장근로(시간)"><NumInput value={ext} onChange={setExt} min={0} /></Field>
                <Field label="월 야간근로(22~06시, 시간)"><NumInput value={night} onChange={setNight} min={0} /></Field>
                <Field label="월 휴일근로 8시간 이내"><NumInput value={hol8} onChange={setHol8} min={0} /></Field>
                <Field label="월 휴일근로 8시간 초과"><NumInput value={holOver} onChange={setHolOver} min={0} /></Field>
              </div>

    function FreelanceCalc() {
      const cfg = useCfg();
      const [revenue, setRevenue] = useState(36000000);
      const [expenseRate, setExpenseRate] = useState(64.1);
      const [family, setFamily] = useState(1);
      const [pensionPaid, setPensionPaid] = useState(0);
      const f = cfg.freelance;
      const withheldTax = Math.floor(revenue * f.incomeRate);
      const withheldLocal = Math.floor(withheldTax * f.localRate);
      const income = Math.max(0, revenue - Math.floor(revenue * (expenseRate / 100)));
      const base = Math.max(0, income - cfg.earned.basicPerPerson * Math.max(1, family) - pensionPaid);
      const br = bracketTax(cfg.incomeTax.brackets, base);
      const decided = Math.max(0, br.tax - f.standardCredit);
      const decidedLocal = Math.floor(decided * cfg.incomeTax.localRate);
      const diff = (withheldTax + withheldLocal) - (decided + decidedLocal);

      return (
        <CalcShell
          title={`${cfg.year}년 3.3% 프리랜서 사업소득세 및 5월 환급 계산기`}
          subtitle={`지급 시 ${pctText(f.incomeRate)}(소득세) + ${pctText(f.incomeRate * f.localRate)}(지방소득세) = ${pctText(f.incomeRate * (1 + f.localRate))}를 원천징수하고, 다음 해 5월 종합소득세 확정신고로 정산합니다.`}

              <Row label="원천징수 합계 (3.3%):" value={`${formatCurrency(withheldTax + withheldLocal)}원`} />
              <Row label="사업소득금액:" value={`${formatCurrency(income)}원`} />
              <Row label="과세표준:" value={`${formatCurrency(base)}원`} />
              <Row label={`산출세액 (${pctText(br.rate, 0)} 구간):`} value={`${formatCurrency(br.tax)}원`} />

              </div>
            </div>
            <ResultPanel title="가산세 합계" big={`${formatCurrency(reduced + late)}원`} bigTone="rose" tone="rose">
              <Row label={`${type.startsWith('noFiling') ? '무신고' : '과소신고'}가산세 (감면 전):`} value={`${formatCurrency(gross)}원`} />

    function SeveranceDetailCalc() {
      const cfg = useCfg();
      const [start, setStart] = useState('2023-03-02');
      const [end, setEnd] = useState('2026-09-30');
      const [pay3, setPay3] = useState(11400000);
      const [bonus, setBonus] = useState(3000000);
      const [leave, setLeave] = useState(0);
      const s = parseDate(start), e = parseDate(end);
      const valid = !!s && !!e && e >= s;
      const totalDays = valid ? dayDiff(s, e) + 1 : 0;
      let threeDays = 0;
      if (valid) {
        const from = new Date(e.getTime());
        from.setMonth(from.getMonth() - 3);
        threeDays = dayDiff(addDays(from, 1), e) + 1;
      }
      const avgDaily = threeDays > 0 ? (pay3 + (bonus * 3) / 12 + (leave * 3) / 12) / threeDays : 0;
      const severance = Math.floor(avgDaily * 30 * (totalDays / 365));
      const eligible = totalDays >= 365;
      const svc = valid ? serviceYears(start, end) : { years: 0 };
      const tax = eligible && svc.years > 0 ? severanceTax(cfg, severance, svc.years) : null;

      return (
        <CalcShell
          title="퇴직금 계산기 (근로자퇴직급여 보장법)"
          subtitle="퇴직 전 3개월 평균임금과 재직일수로 법정 퇴직금을 산출합니다. 퇴직금 = 1일 평균임금 × 30일 × (재직일수 ÷ 365)"
        >
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-3.5 text-xs">

    function InterestCalc() {
      const cfg = useCfg();
      const f = cfg.financial;
      const [principal, setPrincipal] = useState(50000000);
      const [rate, setRate] = useState(3.5);
      const [months, setMonths] = useState(12);
      const [mode, setMode] = useState('normal');
      const gross = Math.floor(principal * (rate / 100) * (months / 12));
      const taxRate = mode === 'exempt' ? 0 : f.withholdingRate;
      const tax = Math.floor(gross * taxRate);
      const local = Math.floor(tax * f.localRate);
      return (
        <CalcShell
          title={`이자소득세 계산기 (예적금 ${pctText(f.withholdingRate * (1 + f.localRate), 1)} 원천징수)`}
          subtitle={`이자소득세 ${pctText(f.withholdingRate, 0)} + 지방소득세 ${pctText(f.withholdingRate * f.localRate, 1)} = ${pctText(f.withholdingRate * (1 + f.localRate), 1)} (단리 기준)`}
        >
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-4 text-xs">
              <Field label="예치 원금 (원)"><NumInput value={principal} onChange={setPrincipal} step={1000000} min={0} /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="연 이율 (%)"><NumInput value={rate} onChange={setRate} step={0.1} min={0} /></Field>
                <Field label="기간 (개월)"><NumInput value={months} onChange={setMonths} min={0} /></Field>

    function DividendCalc() {
      const cfg = useCfg();
      const f = cfg.financial;
      const [amount, setAmount] = useState(5000000);
      const [foreignTax, setForeignTax] = useState(0);
      const rate = f.withholdingRate * (1 + f.localRate);
      const tax = Math.floor(amount * f.withholdingRate);
      const local = Math.floor(tax * f.localRate);
      const net = amount - tax - local;
      return (
        <CalcShell
          title={`배당소득세 계산기 (주식 배당 ${pctText(rate, 1)} 및 Gross-up ${pctText(f.grossUp, 0)} 반영)`}
          subtitle="국내 배당은 원천징수로 납세가 종결되며, 금융소득이 기준금액을 넘으면 종합과세 시 배당가산(Gross-up)·배당세액공제가 적용됩니다."
        >
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-4 text-xs">
              <Field label="연간 배당금 (세전, 원)"><NumInput value={amount} onChange={setAmount} step={100000} min={0} /></Field>

        </CalcShell>
      );
    }

    function PensionCalc() {
      const cfg = useCfg();
      const p = cfg.pension;
      const [amount, setAmount] = useState(12000000);
      const [age, setAge] = useState(65);
      const [other, setOther] = useState(30000000);
      const rate = pensionRate(cfg, age);
      const over = amount > p.separateLimit;
      const lowTax = Math.floor(amount * rate);
      const electedTax = Math.floor(amount * p.electedRate);
      const withPension = bracketTax(cfg.incomeTax.brackets, other + amount).tax;
      const withoutPension = bracketTax(cfg.incomeTax.brackets, other).tax;
      const comprehensive = Math.floor((withPension - withoutPension) * (1 + cfg.incomeTax.localRate));
      return (
        <CalcShell
          title="연금소득세 계산기 (사적연금 저율 분리과세 · 종합과세 비교)"
          subtitle={`연금계좌에서 연금 수령한 사적연금소득이 연 ${unitText(p.separateLimit)} 이하이면 연령별 저율(3.3%~5.5%, 지방소득세 포함)로 분리과세됩니다.`}
        >
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-4 text-xs">
              <Field label="연간 사적연금 수령액 (원)"><NumInput value={amount} onChange={setAmount} step={1000000} min={0} /></Field>
              <Field label="연금 수령 시 나이"><NumInput value={age} onChange={setAge} min={55} /></Field>
              <Field label="그 밖의 종합소득 과세표준 (원)" hint="종합과세 선택 시 비교를 위한 값 (연금소득공제는 미반영)"><NumInput value={other} onChange={setOther} step={1000000} min={0} /></Field>
            </div>
            <ResultPanel title={over ? '분리과세 선택 시 세액 (16.5%)' : `저율 분리과세 세액 (${pctText(rate, 1)})`} big={`${formatCurrency(over ? electedTax : lowTax)}원`}>
              {!over && <Row label={`연령별 세율 (${age}세):`} value={`${pctText(rate, 1)} (지방소득세 포함)`} />}
              {over && (
                <>
                  <Row label="저율 분리과세 한도 초과:" value={`${unitText(p.separateLimit)} 초과`} />
                  <Row label="① 전액 분리과세 선택(15%+지방세):" value={`${formatCurrency(electedTax)}원`} />
                  <Row label="② 종합과세 추가 세액(추정):" value={`${formatCurrency(comprehensive)}원`} />
                  <Row label="유리한 방식:" value={comprehensive < electedTax ? '종합과세' : '분리과세 선택'} strong />
                </>
              )}
              <Row label="세후 수령액:" value={`${formatCurrency(amount - (over ? Math.min(electedTax, comprehensive) : lowTax))}원`} tone="blue" />
            </ResultPanel>
          </div>
          <p className="text-[11px] text-slate-400">* 이연퇴직소득의 연금수령, 공적연금(국민연금 등)의 연금소득공제, 연금계좌 세액공제 환수 등은 반영하지 않은 추정치입니다.</p>
        </CalcShell>
      );
    }

    function RegionalHealthCalc() {
      const cfg = useCfg();
      const r = cfg.insurance.regional;
      const h = cfg.insurance.health;
      const [income, setIncome] = useState(24000000);
      const [points, setPoints] = useState(0);
      const incomePremium = Math.floor((income / 12) * h.rate);
      const propertyPremium = Math.floor(points * r.pointValue);
      let health = floorTo(incomePremium + propertyPremium, 10);
      health = Math.min(r.premiumUpper, Math.max(r.premiumLower, health));
      const ltc = floorTo(health * h.ltcRate, 10);
      return (
        <CalcShell
          title={`${cfg.year}년 지역가입자 건강보험료 추정기`}
          subtitle={`소득월액 × ${pctText(h.rate)} + 재산보험료 부과점수 × ${r.pointValue}원, 장기요양보험료는 건강보험료의 ${pctText(h.ltcRate, 2)}입니다.`}
        >
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-4 text-xs">
              <Field label="연 소득금액 (원)" hint="사업·이자·배당·근로·연금·기타소득 등 보험료 부과 대상 연소득"><NumInput value={income} onChange={setIncome} step={1000000} min={0} /></Field>
              <Field label="재산보험료 부과점수" hint={`재산세 과세표준에서 기본공제 ${unitText(r.propertyDeduction)}를 뺀 금액에 해당하는 점수를 국민건강보험공단 재산등급표에서 확인해 입력하세요. 자동차는 부과하지 않습니다.`}>

              </Field>
            </div>

              <Row label="건강보험료 (상·하한 적용):" value={`${formatCurrency(health)}원`} />
              <Row label="장기요양보험료:" value={`${formatCurrency(ltc)}원`} />

            </ResultPanel>
          </div>
          <p className="text-[11px] text-slate-400">* 지역가입자 월 보험료 상한 {formatCurrency(r.premiumUpper)}원, 하한 {formatCurrency(r.premiumLower)}원. 최저보험료·경감·정산은 반영하지 않았으므로 실제 고지액과 차이가 있을 수 있습니다.</p>

        { id: 13, title: '장부·재무제표와 증빙 보관', category: '장부·재무제표', summary: '매출·매입, 자산·부채, 미수금·미지급금 자료를 결산 전에 대사합니다.', content: '장부에는 거래 사실을 확인할 수 있도록 매출·매입, 계좌 거래, 재고, 고정자산, 미수금·미지급금 등을 기록하고 증빙과 연결해 두는 것이 중요합니다. 손익계산서는 일정 기간의 경영성과를, 재무상태표는 특정 시점의 자산·부채·자본 상태를 보여줍니다. 사업 관련 장부와 증빙은 일반적으로 법정 보존기간을 지켜 보관하며, 이월결손금 공제 등 상황에 따라 더 긴 기간이 적용될 수 있습니다.', source: '국세청 종합소득세 안내', sourceUrl: 'https://www.nts.go.kr/' },
        { id: 14, title: '지방소득세·주민세 등 지방세', category: '지방세', summary: '국세와 별도로 발생하는 지방세의 신고·납부 경로를 안내합니다.', content: '지방소득세, 주민세, 취득세, 재산세 등은 과세 대상과 신고·납부 방식이 서로 다릅니다. 개인지방소득세는 종합소득세 신고와 연계해 신고하는 경우가 많지만 지방자치단체에 별도로 신고·납부해야 합니다. 부동산 취득·보유, 사업장 운영 등 상황에 따라 다른 지방세가 발생할 수 있으므로 위택스와 관할 지방자치단체의 안내 및 고지서를 확인하세요.', source: '위택스 지방세 안내', sourceUrl: 'https://www.wetax.go.kr/' },
        { id: 15, title: '양도소득세·상속세·증여세 기초', category: '재산 관련 세금', summary: '자산 이전·매매·상속·증여 시 과세 여부와 신고기한을 확인합니다.', content: '부동산·주식 등 자산을 양도하면 자산 종류와 거래 조건에 따라 양도소득세 및 관련 신고 의무가 발생할 수 있습니다. 상속세는 상속 개시, 증여세는 증여를 받은 사실을 기준으로 과세 여부와 신고기한을 판단하며, 공제·평가 방법은 자산 종류와 가족관계 등 사실관계에 따라 달라집니다. 취득가액·필요경비·계약서·평가자료 등 증빙을 보관하고 거래 전에 국세청 안내나 세무 전문가를 통해 확인하세요.', source: '국세청 양도·상속·증여세 안내', sourceUrl: 'https://www.nts.go.kr/' }

        { id: 16, title: '간이과세자와 일반과세자 비교', category: '부가가치세', summary: '과세유형별 신고 방식과 매입세액 처리 차이를 이해합니다.', content: '간이과세 적용 여부는 법정 공급대가 기준, 업종, 사업장 요건과 제외 규정 등을 종합해 판단합니다. 간이과세자는 일반과세자와 부가가치세 계산 및 매입세액 공제 방식이 다르며, 세금계산서 발급 가능 여부에도 요건이 있습니다. 매출 규모가 변하거나 사업을 시작·양수하는 경우 과세유형 변경 시점과 신고 의무를 확인하고, 거래처가 세금계산서를 요구하는지 등 사업 특성도 함께 검토하세요.', source: '국세청 간이과세 안내', sourceUrl: 'https://www.nts.go.kr/' },

        { id: 19, title: '사업용 계좌와 개인자금 분리', category: '사업자 장부관리', summary: '사업 거래와 개인 거래를 분리해 장부 오류와 증빙 누락을 줄입니다.', content: '사업용 계좌를 사용하면 매출 입금, 거래처 대금, 급여, 세금 납부 등 사업 관련 흐름을 추적하기 쉬워집니다. 법정 사업용 계좌 신고 의무는 복식부기의무자 등 대상 요건에 따라 달라질 수 있으므로 본인의 의무 여부를 확인하세요. 개인자금이 사업 계좌에 입출금된 경우 거래 성격을 메모하고, 사업비와 개인 소비를 구분해 장부와 통장 내역을 정기적으로 대사하는 것이 중요합니다.', source: '국세청 종합소득세·장부 안내', sourceUrl: 'https://www.nts.go.kr/' },

    function TaxInvoiceModal({ company, kind, onClose, onIssued }) {
      const cfg = useCfg();
      const [buyerName, setBuyerName] = useState('(주)파트너사');
      const [buyerBiz, setBuyerBiz] = useState('220-81-62517');
      const [buyerCeo, setBuyerCeo] = useState('김대표');
      const [buyerEmail, setBuyerEmail] = useState('partner@example.com');
      const [itemDesc, setItemDesc] = useState('2026년 시스템 개발 및 유지보수 용역');
      const [supplyAmount, setSupplyAmount] = useState(3000000);
      const [bizStatus, setBizStatus] = useState('');
      const taxAmount = Math.floor(supplyAmount * cfg.einvoice.vatRate);
      const grandTotal = supplyAmount + taxAmount;

      // 국세청 사업자등록 상태조회 (공공데이터포털 API, 중계 서버 필요)
      const checkBizStatus = async () => {
        const digits = buyerBiz.replace(/[^0-9]/g, '');
        if (digits.length !== 10) { setBizStatus('사업자등록번호 10자리를 입력해 주세요.'); return; }
        if (!NTS_PROXY_URL) { setBizStatus('상태조회 서버(NTS_PROXY_URL)가 설정되지 않았습니다. 홈택스 > 사업자 상태조회에서 직접 확인하세요.'); return; }
        setBizStatus('조회 중...');
        try {
          const res = await fetch(NTS_PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ b_no: [digits] })
          });
          const json = await res.json();
          const row = json && json.data && json.data[0];
          if (!row) { setBizStatus('조회 결과가 없습니다.'); return; }
          const end = row.end_dt ? ` (폐업일 ${row.end_dt})` : '';
          setBizStatus(`${row.b_stt || row.tax_type || '조회 결과 없음'}${end}`);
        } catch (err) {
          setBizStatus('상태조회에 실패했습니다. 잠시 후 다시 시도해 주세요.');
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-3 border-b">
              <h3 className="font-bold text-slate-900 text-base">
                국세청 표준 전자세금계산서 작성 ({kind === 'sales' ? '매출' : '매입'})
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl font-bold">×</button>
            </div>

            <div className="border-2 border-red-500 rounded-xl p-4 bg-red-50/10 space-y-4 text-xs">
              <div className="grid grid-cols-2 gap-4">
                <div className="p-3 bg-red-50/40 rounded-lg">
                  <div className="font-bold text-red-700 mb-2">공급자 (발행자)</div>
                  <div>상호: {company.companyName}</div>
                  <div>등록번호: {company.bizNumber}</div>
                  <div>대표: {company.ceoName}</div>
                  <div>이메일: {company.email}</div>
                </div>
                <div className="p-3 bg-blue-50/40 rounded-lg space-y-2">
                  <div className="font-bold text-blue-700">공급받는자</div>
                  <input type="text" value={buyerName} onChange={e => setBuyerName(e.target.value)} className="w-full px-2 py-1 border rounded" placeholder="상호명" />
                  <input type="text" value={buyerBiz} onChange={e => setBuyerBiz(e.target.value)} className="w-full px-2 py-1 border rounded font-mono" placeholder="등록번호" />
                  <div className="flex items-center gap-2">
                    <button type="button" onClick={checkBizStatus} className="px-2 py-1 border border-blue-300 text-blue-700 rounded bg-white text-[11px] font-semibold">국세청 사업자 상태조회</button>
                    {bizStatus && <span className="text-[11px] text-slate-600 leading-tight">{bizStatus}</span>}
                  </div>
                  <input type="email" value={buyerEmail} onChange={e => setBuyerEmail(e.target.value)} className="w-full px-2 py-1 border rounded font-mono" placeholder="이메일" />
                </div>
              </div>

              <div className="space-y-2">
                <label className="font-semibold block">품목명 / 공급가액</label>
                <input type="text" value={itemDesc} onChange={e => setItemDesc(e.target.value)} className="w-full px-3 py-2 border rounded-lg" />
                <div className="grid grid-cols-2 gap-3 pt-1">
                  <div>
                    <span className="text-slate-500 block mb-1">공급가액(원)</span>
                    <input type="number" value={supplyAmount} onChange={(e) => setSupplyAmount(Number(e.target.value))} className="w-full px-3 py-2 border rounded-lg font-bold" />
                  </div>
                  <div>
                    <span className="text-slate-500 block mb-1">세액(VAT {pctText(cfg.einvoice.vatRate, 0)})</span>
                    <div className="px-3 py-2 border rounded-lg bg-slate-50 font-bold text-red-600">{formatCurrency(taxAmount)}원</div>
                  </div>
                </div>
              </div>

              <div className="flex justify-between items-center p-3 bg-red-100/50 rounded-lg text-sm font-bold">
                <span>합계금액(총 청구액):</span>
                <span className="text-red-700 text-base">{formatCurrency(grandTotal)} 원</span>
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-2">
              <button onClick={onClose} className="px-4 py-2 text-xs border rounded-lg hover:bg-slate-50">취소</button>
              <button onClick={onIssued} className="px-5 py-2 text-xs bg-slate-900 text-white font-bold rounded-lg shadow-sm">
                2048bit PKI 전자서명 및 국세청 발행
              </button>
            </div>
          </div>
        </div>
      );
    }

    // 정책 안내 모달
    function PolicyModal({ policyKey, onClose, email }) {
      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border space-y-4">
            <div className="flex justify-between items-center pb-3 border-b">
              <h3 className="font-bold text-slate-900 text-base">
                {policyKey === 'privacy' && '개인정보처리방침'}
                {policyKey === 'terms' && '서비스 이용약관'}
                {policyKey === 'about' && '서비스 소개 (About Us)'}
                {policyKey === 'contact' && '고객지원 및 문의하기'}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl font-bold">×</button>
            </div>
            <div className="text-xs text-slate-600 space-y-3 leading-relaxed">
              {policyKey === 'privacy' && (
                <>
                  <p>Premium Tax는 이용자의 개인정보 및 세무 데이터를 최우선으로 보호합니다. 본 사이트의 모든 모의계산은 사용자의 로컬 브라우저에서 수행되며 서버에 금융정보나 급여내역을 저장하지 않습니다. 최신 요율 반영을 위해 공개 요율표 파일(tax-rates.json)만 내려받으며, 입력하신 값은 외부로 전송되지 않습니다.</p>
                  <p>문의처: {email}</p>
                </>
              )}
              {policyKey === 'terms' && (
                <p>본 사이트의 세무 및 4대보험 계산 결과는 공표된 세법·고시 요율을 바탕으로 산출된 모의계산 참고자료이며, 법적 세무 신고 시에는 국세청 홈택스 및 공인세무사의 확인을 권장합니다.</p>
              )}
              {policyKey === 'about' && (
                <p>Premium Tax는 소상공인과 근로자를 위해 국세청 표준 전자세금계산서 작성과 23종 실무 세무 계산을 원클릭으로 지원하는 스마트 세무 포털입니다.</p>
              )}
              {policyKey === 'contact' && (
                <div className="p-4 bg-slate-50 rounded-xl space-y-2 border">
                  <div>📧 <strong>이메일 문의:</strong> {email}</div>
                  <div>📞 <strong>고객센터 전화:</strong> 미정</div>
                  <div>⏰ <strong>운영시간:</strong> 미정</div>
                </div>
              )}
            </div>
            <div className="flex justify-end pt-2">
              <button onClick={onClose} className="px-4 py-2 bg-slate-900 text-white font-bold text-xs rounded-lg">확인</button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <RatesProvider>
        <App />
      </RatesProvider>
    );
  </script>
</body>
</html>
