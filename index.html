      const [activeCategory, setActiveCategory] = useState('all');
      const [selectedCalc, setSelectedCalc] = useState('salary');

      // Quick mini calculator state
      const [quickMode, setQuickMode] = useState('monthly');
      const [quickAmount, setQuickAmount] = useState(3500000);

      const quickResult = useMemo(() => {
        const gross = quickMode === 'annual' ? Math.floor(quickAmount / 12) : Number(quickAmount) || 0;
        const nonTaxable = 200000;
        const taxable = Math.max(0, gross - nonTaxable);

        const nationalPension = Math.floor(Math.min(taxable, 6170000) * 0.045);
        const healthInsurance = Math.floor(taxable * 0.03545);
        const longTermCare = Math.floor(healthInsurance * 0.1295);
        const employmentInsurance = Math.floor(taxable * 0.009);

        let incomeTax = 0;
        if (taxable > 10000000) incomeTax = Math.floor(taxable * 0.25);
        else if (taxable > 6000000) incomeTax = Math.floor(taxable * 0.16);
        else if (taxable > 3000000) incomeTax = Math.floor(taxable * 0.08);
        else if (taxable > 1500000) incomeTax = Math.floor(taxable * 0.03);

        const localIncomeTax = Math.floor(incomeTax * 0.1);
        const totalDeduction = nationalPension + healthInsurance + longTermCare + employmentInsurance + incomeTax + localIncomeTax;
        const netPay = gross - totalDeduction;

        return { nationalPension, healthInsurance, longTermCare, employmentInsurance, incomeTax, localIncomeTax, totalDeduction, netPay, gross };

      return <SalaryDetailCalc />;

    function SalaryDetailCalc() {
      const [salaryType, setSalaryType] = useState('year');
      const [amount, setAmount] = useState(48000000);
      const [nonTax, setNonTax] = useState(200000);
      const [familyCount, setFamilyCount] = useState(1);
      const [childCount, setChildCount] = useState(0);

      const gross = salaryType === 'year' ? Math.floor(amount / 12) : amount;
      const taxable = Math.max(0, gross - nonTax);

      const np = Math.floor(Math.min(taxable, 6170000) * 0.045);
      const hi = Math.floor(taxable * 0.03545);
      const lt = Math.floor(hi * 0.1295);
      const ei = Math.floor(taxable * 0.009);

      let it = Math.floor(taxable * 0.05);
      if (familyCount > 1) it = Math.max(0, it - (familyCount - 1) * 20000);
      if (childCount > 0) it = Math.max(0, it - childCount * 15000);
      const lit = Math.floor(it * 0.1);

      const totalDeduction = np + hi + lt + ei + it + lit;
      const netPay = gross - totalDeduction;

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100">
            <div>
              <h3 className="text-base font-bold text-slate-900">2026년 연봉/월급 실수령액 정밀 계산기</h3>
              <p className="text-xs text-slate-500 mt-0.5">부양가족 및 2026년 최신 4대보험 개정 요율을 1원 단위까지 정밀 산출합니다.</p>
            </div>
            <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-lg text-xs font-semibold">
              <button onClick={() => setSalaryType('year')} className={`px-3 py-1 rounded-md ${salaryType === 'year' ? 'bg-white text-blue-700 shadow-2xs font-bold' : 'text-slate-600'}`}>연봉 기준</button>
              <button onClick={() => setSalaryType('month')} className={`px-3 py-1 rounded-md ${salaryType === 'month' ? 'bg-white text-blue-700 shadow-2xs font-bold' : 'text-slate-600'}`}>월급 기준</button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-4 text-xs">
              <div>
                <label className="font-semibold text-slate-700 block mb-1">
                  {salaryType === 'year' ? '세전 희망 연봉 (원)' : '세전 월 기본급 (원)'}
                </label>
                <input
                  type="number"
                  step="100000"
                  value={amount}
                  onChange={(e) => setAmount(Number(e.target.value))}
                  className="w-full px-3.5 py-2.5 text-sm font-bold font-mono border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500"
                />
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="font-semibold text-slate-700 block mb-1">월 비과세액</label>
                  <input type="number" value={nonTax} onChange={(e) => setNonTax(Number(e.target.value))} className="w-full px-3 py-2 border rounded-xl" />
                </div>
                <div>
                  <label className="font-semibold text-slate-700 block mb-1">부양가족(본인포함)</label>
                  <input type="number" min="1" value={familyCount} onChange={(e) => setFamilyCount(Number(e.target.value))} className="w-full px-3 py-2 border rounded-xl" />
                </div>
                <div>
                  <label className="font-semibold text-slate-700 block mb-1">20세 이하 자녀</label>
                  <input type="number" min="0" value={childCount} onChange={(e) => setChildCount(Number(e.target.value))} className="w-full px-3 py-2 border rounded-xl" />
                </div>
              </div>
            </div>

            <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-3.5">
              <div className="flex justify-between items-baseline pb-3 border-b border-slate-200">
                <span className="text-xs font-bold text-slate-500">예상 월 통장 실수령액</span>
                <span className="text-2xl font-extrabold text-blue-700 font-mono">{formatCurrency(netPay)}원</span>
              </div>
              <div className="space-y-2 text-xs">
                <div className="flex justify-between text-slate-600"><span>월 환산 총 급여:</span><strong>{formatCurrency(gross)}원</strong></div>
                <div className="flex justify-between text-slate-600"><span>국민연금 (4.5%):</span><span>{formatCurrency(np)}원</span></div>
                <div className="flex justify-between text-slate-600"><span>건강보험 (3.545%):</span><span>{formatCurrency(hi)}원</span></div>
                <div className="flex justify-between text-slate-600"><span>노인장기요양 (12.95%):</span><span>{formatCurrency(lt)}원</span></div>
                <div className="flex justify-between text-slate-600"><span>고용보험 (0.9%):</span><span>{formatCurrency(ei)}원</span></div>
                <div className="flex justify-between text-slate-600"><span>근로소득세 + 지방세:</span><span>{formatCurrency(it + lit)}원</span></div>
                <div className="flex justify-between text-rose-600 font-bold pt-2 border-t border-slate-200">
                  <span>총 공제 합계액:</span><span>{formatCurrency(totalDeduction)}원</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );

                  <div className="font-bold text-blue-700">공급받는자</div>
                  <input type="text" value={buyerName} onChange={e => setBuyerName(e.target.value)} className="w-full px-2 py-1 border rounded" placeholder="상호명" />
                  <input type="text" value={buyerBiz} onChange={e => setBuyerBiz(e.target.value)} className="w-full px-2 py-1 border rounded font-mono" placeholder="등록번호" />
                  <input type="email" value={buyerEmail} onChange={e => setBuyerEmail(e.target.value)} className="w-full px-2 py-1 border rounded font-mono" placeholder="이메일" />
                </div>
              </div>

              <div className="space-y-2">
                <label className="font-semibold block">품목명 / 공급가액</label>
                <input type="text" value={itemDesc} onChange={e => setItemDesc(e.target.value)} className="w-full px-3 py-2 border rounded-lg" />
                <div className="grid grid-cols-2 gap-3 pt-1">
                  <div>
                    <span className="text-slate-500 block mb-1">공급가액(원)</span>
                    <input type="number" value={supplyAmount} onChange={e => setSupplyAmount(Number(e.target.value))} className="w-full px-3 py-2 border rounded-lg font-bold" />
                  </div>
                  <div>
                    <span className="text-slate-500 block mb-1">세액(VAT 10%)</span>
                    <div className="px-3 py-2 border rounded-lg bg-slate-50 font-bold text-red-600">{formatCurrency(taxAmount)}원</div>
                  </div>
                </div>
              </div>

              <div className="flex justify-between items-center p-3 bg-red-100/50 rounded-lg text-sm font-bold">
                <span>합계금액(총 청구액):</span>
                <span className="text-red-700 text-base">{formatCurrency(grandTotal)} 원</span>
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-2">
              <button onClick={onClose} className="px-4 py-2 text-xs border rounded-lg hover:bg-slate-50 cursor-pointer">취소</button>
              <button onClick={onIssued} className="px-5 py-2 text-xs bg-slate-900 text-white font-bold rounded-lg shadow-sm cursor-pointer">
                2048bit PKI 전자서명 및 국세청 발행
              </button>
            </div>
          </div>
        </div>
      );
    }

    // 정책 안내 모달
    function PolicyModal({ policyKey, onClose, email }) {
      return (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border space-y-4">
            <div className="flex justify-between items-center pb-3 border-b">
              <h3 className="font-bold text-slate-900 text-base">
                {policyKey === 'privacy' && '개인정보처리방침'}
                {policyKey === 'terms' && '서비스 이용약관'}
                {policyKey === 'about' && '서비스 소개 (About Us)'}
                {policyKey === 'contact' && '고객지원 및 문의하기'}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl font-bold cursor-pointer">×</button>
            </div>
            <div className="text-xs text-slate-600 space-y-3 leading-relaxed">
              {policyKey === 'privacy' && (
                <>
                  <p>TaxOne은 이용자의 개인정보 및 세무 데이터를 최우선으로 보호합니다. 본 사이트의 모든 모의계산은 사용자의 로컬 브라우저에서 수행되며 서버에 금융정보나 급여내역을 저장하지 않습니다.</p>
                  <p>문의처: {email}</p>
                </>
              )}
              {policyKey === 'terms' && (
                <p>본 사이트의 세무 및 4대보험 계산 결과는 2026년 세법 규정을 바탕으로 산출된 모의계산 참고자료이며, 법적 세무 신고 시에는 공인세무사의 확인을 권장합니다.</p>
              )}
              {policyKey === 'about' && (
                <p>TaxOne은 소상공인과 근로자를 위해 국세청 표준 전자세금계산서 작성과 23종 실무 세무 계산을 원클릭으로 지원하는 스마트 세무 포털입니다.</p>
              )}
              {policyKey === 'contact' && (
                <div className="p-4 bg-slate-50 rounded-xl space-y-2 border">
                  <div>📧 <strong>이메일 문의:</strong> {email}</div>
                  <div>📞 <strong>고객센터 전화:</strong> 미정</div>
                  <div>⏰ <strong>운영시간:</strong> 미정</div>
                </div>
              )}
            </div>
            <div className="flex justify-end pt-2">
              <button onClick={onClose} className="px-4 py-2 bg-slate-900 text-white font-bold text-xs rounded-lg cursor-pointer">확인</button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
