          { id: 'item-3', date: '10-20', name: '클라우드 인프라 호스팅 (VPC 및 Kubernetes 클러스터)', spec: '월간', qty: 1, unitPrice: 3200000, supplyAmount: 3200000, taxAmount: 320000, remark: '10월 이용료' }

      },
      {

        manageNumber: '20261019-41000003-51829013',

        kind: 'sales',

          { id: 'item-4', date: '10-19', name: '전자세금계산서 API 모듈 연동 라이선스', spec: 'Enterprise', qty: 1, unitPrice: 8500000, supplyAmount: 8500000, taxAmount: 850000, remark: '1년 라이선스' }

    function App() {
      // 1. 처음 접속 시 비로그인(null) 상태로 시작
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('taxone_current_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [company, setCompany] = useState(() => {
        try {
          const saved = localStorage.getItem('taxone_company_profile');
          return saved ? JSON.parse(saved) : DEFAULT_COMPANY;
        } catch (e) {
          return DEFAULT_COMPANY;
        }
      });

      const [invoices, setInvoices] = useState(() => {
        try {
          const saved = localStorage.getItem('taxone_invoices');
          return saved ? JSON.parse(saved) : INITIAL_INVOICES;
        } catch (e) {
          return INITIAL_INVOICES;
        }
      });

      const [counterparties, setCounterparties] = useState(() => {
        try {
          const saved = localStorage.getItem('taxone_counterparties');
          return saved ? JSON.parse(saved) : INITIAL_COUNTERPARTIES;
        } catch (e) {
          return INITIAL_COUNTERPARTIES;
        }
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [filterKind, setFilterKind] = useState('all');
      const [filterStatus, setFilterStatus] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [selectedInvoice, setSelectedInvoice] = useState(null);
      const [isWriting, setIsWriting] = useState(false);
      const [writeKind, setWriteKind] = useState('sales');
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginMode, setLoginMode] = useState('login'); // 'login' | 'signup'

      // 로그인/회원가입 입력 상태
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authName, setAuthName] = useState('');
      const [authCompany, setAuthCompany] = useState('');
      const [authBizNumber, setAuthBizNumber] = useState('');

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('taxone_current_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('taxone_current_user');
        }
      }, [currentUser]);

      useEffect(() => {
        localStorage.setItem('taxone_company_profile', JSON.stringify(company));
      }, [company]);

      useEffect(() => {
        localStorage.setItem('taxone_invoices', JSON.stringify(invoices));
      }, [invoices]);

      // 로그인 처리
      const handleLogin = (e) => {
        e?.preventDefault();
        if (!authEmail.trim()) {
          alert('이메일(아이디)을 입력해주세요.');
          return;
        }
        const user = {
          id: 'user_' + Date.now(),
          name: authName.trim() || authEmail.split('@')[0],
          email: authEmail.trim(),
          companyName: authCompany.trim() || '미등록 사업자',
          bizNumber: authBizNumber.trim() || ''
        };
        setCurrentUser(user);
        if (user.companyName !== '미등록 사업자' || user.bizNumber) {
          setCompany(prev => ({
            ...prev,
            companyName: user.companyName,
            bizNumber: user.bizNumber,
            ceoName: user.name,
            email: user.email
          }));
        }
        setShowLoginModal(false);
        setAuthEmail('');
        setAuthPassword('');
        setAuthName('');
        setAuthCompany('');
        setAuthBizNumber('');
      };

      // 로그아웃 처리 (완전 초기화)
      const handleLogout = () => {
        if (confirm('로그아웃 하시겠습니까?')) {
          setCurrentUser(null);
          localStorage.removeItem('taxone_current_user');
          setSelectedInvoice(null);
          setIsWriting(false);
          setShowProfileModal(false);
        }
      };

      // 2. 로그인된 본인의 세금계산서만 필터링
      const myInvoices = currentUser ? invoices : [];

      const filteredInvoices = myInvoices.filter(inv => {
        if (filterKind !== 'all' && inv.kind !== filterKind) return false;
        if (filterStatus !== 'all' && inv.status !== filterStatus) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const target = inv.kind === 'sales' ? inv.buyer : inv.supplier;
          return (
            (target?.companyName || '').toLowerCase().includes(q) ||
            (target?.bizNumber || '').includes(q) ||
            inv.items.some(it => (it.name || '').toLowerCase().includes(q))
          );
        }
        return true;
      });

      const totalSales = myInvoices.filter(i => i.kind === 'sales').reduce((sum, i) => sum + i.grandTotal, 0);
      const totalPurchase = myInvoices.filter(i => i.kind === 'purchase').reduce((sum, i) => sum + i.grandTotal, 0);
      const pendingCount = myInvoices.filter(i => i.status === 'draft').length;

        <div className="flex flex-col min-h-screen">

                  </div>

                </div>

                    onClick={() => { setActiveTab('dashboard'); setIsWriting(false); setSelectedInvoice(null); }}

                  >
                    대시보드

                  <button

                    <button 
                      onClick={handleLogout}

                      로그아웃

                ) : (
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => { setLoginMode('login'); setShowLoginModal(true); }}

                      로그인

                        <h2 className="font-bold text-base">로그인 후 내 사업장 세금계산서를 안전하게 관리하세요</h2>

                      <p className="text-xs text-blue-100 mt-1">

                      </p>

                      {activeTab === 'counterparties' && '등록 거래처 및 사업자 관리'}

                    <p className="text-xs text-slate-500 mt-1">
                      국세청 표준 전자세금계산서 별지 제11호 서식 규격 준수 및 홈택스 실시간 연계 시스템
                    </p>
                  </div>

                  <div className="flex items-center gap-2.5">

                        setWriteKind('sales');
                        setIsWriting(true);

                      매출 세금계산서 작성

                        if (!currentUser) {
                          alert('세금계산서 등록은 로그인 후 이용하실 수 있습니다.');
                          setLoginMode('login');
                          setShowLoginModal(true);
                          return;

                        setWriteKind('purchase');

                      className="w-full p-2 border border-slate-300 rounded-lg font-mono"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-500 mb-1 font-semibold">상호 (법인명)</label>
                      <input 
                        value={company.companyName} 
                        onChange={e => setCompany({...company, companyName: e.target.value})} 
                        placeholder="상호 또는 법인명 입력"
                        className="w-full p-2 border border-slate-300 rounded-lg"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-500 mb-1 font-semibold">대표자 성명</label>
                      <input 
                        value={company.ceoName} 
                        onChange={e => setCompany({...company, ceoName: e.target.value})} 
                        placeholder="대표자명 입력"
                        className="w-full p-2 border border-slate-300 rounded-lg"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-500 mb-1 font-semibold">사업장 소재지 주소</label>
                    <input 
                      value={company.address} 
                      onChange={e => setCompany({...company, address: e.target.value})} 
                      placeholder="사업장 도로명 주소 입력"
                      className="w-full p-2 border border-slate-300 rounded-lg"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-500 mb-1 font-semibold">업태</label>
                      <input 
                        value={company.bizType} 
                        onChange={e => setCompany({...company, bizType: e.target.value})} 
                        placeholder="업태 입력"
                        className="w-full p-2 border border-slate-300 rounded-lg"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-500 mb-1 font-semibold">종목</label>
                      <input 
                        value={company.bizItem} 
                        onChange={e => setCompany({...company, bizItem: e.target.value})} 
                        placeholder="종목 입력"
                        className="w-full p-2 border border-slate-300 rounded-lg"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-500 mb-1 font-semibold">전자세금계산서 수신 이메일</label>
                    <input 
                      value={company.email} 
                      onChange={e => setCompany({...company, email: e.target.value})} 
                      placeholder="tax@example.com"
                      className="w-full p-2 border border-slate-300 rounded-lg font-mono"
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                  <button onClick={() => setShowProfileModal(false)} className="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold cursor-pointer">
                    취소
                  </button>
                  <button onClick={() => { setShowProfileModal(false); alert('사업자 정보가 저장되었습니다.'); }} className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold cursor-pointer">
                    저장하기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 로그인 / 회원가입 모달 */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg cursor-pointer">×</button>
                <div className="text-center mb-5">
                  <div className="w-10 h-10 bg-blue-600 text-white font-black text-xl rounded-xl flex items-center justify-center mx-auto mb-2 shadow-xs">T</div>
                  <h3 className="text-lg font-black text-slate-900">
                    {loginMode === 'login' ? 'TaxOne 로그인' : 'TaxOne 신규 회원가입'}
                  </h3>
                  <p className="text-xs text-slate-500 mt-0.5">
                    {loginMode === 'login' ? '등록된 계정으로 로그인하세요.' : '새로운 사업자 계정을 생성합니다.'}
                  </p>
                </div>

                <form onSubmit={handleLogin} className="space-y-3 text-xs">
                  {loginMode === 'signup' && (
                    <>
                      <div>
                        <label className="block text-slate-600 font-semibold mb-1">성명 (대표자)</label>
                        <input 
                          type="text" 
                          required 
                          value={authName} 
                          onChange={e => setAuthName(e.target.value)} 
                          placeholder="홍길동"
                          className="w-full p-2.5 border border-slate-300 rounded-xl focus:border-blue-600"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-600 font-semibold mb-1">상호 또는 회사명</label>
                        <input 
                          type="text" 
                          required 
                          value={authCompany} 
                          onChange={e => setAuthCompany(e.target.value)} 
                          placeholder="(주)텍스원"
                          className="w-full p-2.5 border border-slate-300 rounded-xl focus:border-blue-600"
                        />
                      </div>
                    </>
                  )}

                  <div>
                    <label className="block text-slate-600 font-semibold mb-1">이메일 주소</label>
                    <input 
                      type="email" 
                      required 
                      value={authEmail} 
                      onChange={e => setAuthEmail(e.target.value)} 
                      placeholder="user@example.com"
                      className="w-full p-2.5 border border-slate-300 rounded-xl focus:border-blue-600"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-600 font-semibold mb-1">비밀번호</label>
                    <input 
                      type="password" 
                      required 
                      value={authPassword} 
                      onChange={e => setAuthPassword(e.target.value)} 
                      placeholder="••••••••"
                      className="w-full p-2.5 border border-slate-300 rounded-xl focus:border-blue-600"
                    />
                  </div>

                  <button 
                    type="submit" 
                    className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-xs cursor-pointer transition-colors mt-2"
                  >
                    {loginMode === 'login' ? '로그인' : '회원가입 완료'}
                  </button>
                </form>

                <div className="mt-4 pt-3 border-t border-slate-200 text-center text-xs text-slate-500">
                  {loginMode === 'login' ? (
                    <div>
                      아직 계정이 없으신가요?{' '}
                      <button onClick={() => setLoginMode('signup')} className="text-blue-600 font-bold hover:underline cursor-pointer">
                        회원가입
                      </button>
                    </div>
                  ) : (
                    <div>
                      이미 계정이 있으신가요?{' '}
                      <button onClick={() => setLoginMode('login')} className="text-blue-600 font-bold hover:underline cursor-pointer">
                        로그인
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 세금계산서 작성 서식 컴포넌트
    function InvoiceWriter({ kind, company, counterparties, onSave, onCancel }) {
      const [buyer, setBuyer] = useState(counterparties[0]);
      const [itemDesc, setItemDesc] = useState('');
      const [qty, setQty] = useState(1);
      const [unitPrice, setUnitPrice] = useState(0);

      const supply = Number(qty || 0) * Number(unitPrice || 0);
      const tax = Math.round(supply * 0.1);
      const grand = supply + tax;

      const handleSubmit = () => {
        if (!itemDesc.trim()) {
          alert('품목명을 입력해주세요.');
          return;
        }
        const newInvoice = {
          id: 'inv-' + Date.now(),
          manageNumber: '20261022-4100' + Math.floor(Math.random() * 89999 + 10000),
          type: 'general',
          kind: kind,
          writeDate: '2026-10-22',
          supplier: kind === 'sales' ? company : buyer,
          buyer: kind === 'sales' ? buyer : company,
          items: [
            {
              id: 'it-' + Date.now(),
              date: '10-22',
              name: itemDesc,
              spec: '표준',
              qty: Number(qty),
              unitPrice: Number(unitPrice),
              supplyAmount: supply,
              taxAmount: tax,
              remark: ''
            }
          ],
          totalSupplyAmount: supply,
          totalTaxAmount: tax,
          grandTotal: grand,
          cash: 0, check: 0, promissoryNote: 0, receivable: grand,
          purpose: 'claim',
          status: 'draft',
          hometaxApprovalNo: ''
        };
        onSave(newInvoice);
      };

      return (
        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-2xs space-y-6 max-w-3xl mx-auto">
          <div className="flex justify-between items-center pb-4 border-b border-slate-200">
            <h2 className="text-lg font-bold text-slate-900">
              {kind === 'sales' ? '매출 세금계산서 작성' : '매입 세금계산서 등록'}
            </h2>
            <button onClick={onCancel} className="text-slate-400 hover:text-slate-600 cursor-pointer">닫기</button>
          </div>

          <div className="grid grid-cols-2 gap-4 text-xs">
            <div>
              <label className="block text-slate-500 mb-1 font-semibold">거래처 선택</label>
              <select onChange={e => setBuyer(counterparties.find(c => c.id === e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg">
                {counterparties.map(c => <option key={c.id} value={c.id}>{c.companyName} ({c.bizNumber})</option>)}
              </select>
            </div>
            <div>
              <label className="block text-slate-500 mb-1 font-semibold">작성일자</label>
              <input type="date" defaultValue="2026-10-22" className="w-full p-2 border border-slate-300 rounded-lg" />
            </div>
          </div>

          <div className="space-y-3 text-xs">
            <h3 className="font-bold text-slate-800">품목 정보</h3>
            <div className="grid grid-cols-4 gap-3">
              <div className="col-span-2">
                <label className="block text-slate-500 mb-1">품목명</label>
                <input value={itemDesc} onChange={e => setItemDesc(e.target.value)} placeholder="예: 유지보수 컨설팅 용역" className="w-full p-2 border border-slate-300 rounded-lg" />
              </div>
              <div>
                <label className="block text-slate-500 mb-1">수량</label>
                <input type="number" value={qty} onChange={e => setQty(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg font-mono text-center" />
              </div>
              <div>
                <label className="block text-slate-500 mb-1">단가 (원)</label>
                <input type="number" value={unitPrice} onChange={e => setUnitPrice(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg font-mono text-right" />
              </div>
            </div>
          </div>

          <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
            <div>공급가액: <strong className="font-mono text-sm ml-1">₩ {formatCurrency(supply)}</strong></div>
            <div>세액 (10%): <strong className="font-mono text-sm ml-1 text-red-600">₩ {formatCurrency(tax)}</strong></div>
            <div>총 합계금액: <strong className="font-mono text-base ml-1 text-blue-700">₩ {formatCurrency(grand)}</strong></div>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button onClick={onCancel} className="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold cursor-pointer">취소</button>
            <button onClick={handleSubmit} className="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold cursor-pointer">발행 및 저장</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
