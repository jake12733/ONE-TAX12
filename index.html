      // 1. 처음 접속 시 비로그인(null) 상태로 시작
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('taxone_current_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [myCompany, setMyCompany] = useState(() => {
        try {
          const saved = localStorage.getItem('taxone_my_company');
          return saved ? JSON.parse(saved) : DEFAULT_COMPANY;
        } catch (e) {
          return DEFAULT_COMPANY;
        }
      });

      const [counterparties, setCounterparties] = useState(() => {
        try {
          const saved = localStorage.getItem('taxone_counterparties');
          return saved ? JSON.parse(saved) : INITIAL_COUNTERPARTIES;
        } catch (e) {
          return INITIAL_COUNTERPARTIES;
        }
      });

      const [invoices, setInvoices] = useState(() => {
        try {
          if (!currentUser) return [];
          const userKey = `taxone_invoices_${currentUser.id || currentUser.email}`;
          const saved = localStorage.getItem(userKey);
          return saved ? JSON.parse(saved) : INITIAL_INVOICES;
        } catch (e) {
          return [];
        }
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [filterKind, setFilterKind] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [viewingInvoice, setViewingInvoice] = useState(null);
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [formInitialKind, setFormInitialKind] = useState('sales');
      const [signingInvoice, setSigningInvoice] = useState(null);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [toast, setToast] = useState(null);
      const [profileMenuOpen, setProfileMenuOpen] = useState(false);
      const dropdownRef = useRef(null);

      // 인증 상태 로컬 스토리지 동기화
      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('taxone_current_user', JSON.stringify(currentUser));
          const userKey = `taxone_invoices_${currentUser.id || currentUser.email}`;
          const saved = localStorage.getItem(userKey);
          if (saved) {
            try { setInvoices(JSON.parse(saved)); } catch (e) { setInvoices([]); }
          } else {
            setInvoices(INITIAL_INVOICES);
          }
        } else {
          localStorage.removeItem('taxone_current_user');
          setInvoices([]);
        }
      }, [currentUser]);

      // 사업자 정보 저장
      useEffect(() => {
        localStorage.setItem('taxone_my_company', JSON.stringify(myCompany));
      }, [myCompany]);

      // 세금계산서 목록 저장
      useEffect(() => {
        if (currentUser) {
          const userKey = `taxone_invoices_${currentUser.id || currentUser.email}`;
          localStorage.setItem(userKey, JSON.stringify(invoices));
        }
      }, [invoices, currentUser]);

      // 드롭다운 외부 클릭 감지
      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setProfileMenuOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // 로그아웃 핸들러
      const handleLogout = () => {
        setCurrentUser(null);
        setProfileMenuOpen(false);
        showToast('정상적으로 로그아웃되었습니다.');
      };

      // 로그인 핸들러
      const handleLoginSuccess = (userData) => {
        setCurrentUser(userData);
        setAuthModalOpen(false);
        showToast(`${userData.name}님 환영합니다!`);
      };

      const totalSalesSupply = salesInvoices.reduce((s, i) => s + i.totalSupplyAmount, 0);
      const totalSalesTax = salesInvoices.reduce((s, i) => s + i.totalTaxAmount, 0);
      const totalSalesGrand = totalSalesSupply + totalSalesTax;

      const purchaseInvoices = invoices.filter(i => i.kind === 'purchase');
      const totalPurchaseSupply = purchaseInvoices.reduce((s, i) => s + i.totalSupplyAmount, 0);
      const totalPurchaseTax = purchaseInvoices.reduce((s, i) => s + i.totalTaxAmount, 0);
      const totalPurchaseGrand = totalPurchaseSupply + totalPurchaseTax;

      const estimatedVatPayable = totalSalesTax - totalPurchaseTax;

      const sentCount = invoices.filter(i => i.status === 'hometax_sent').length;
      const unsentCount = invoices.filter(i => i.status === 'issued').length;
      const draftCount = invoices.filter(i => i.status === 'draft').length;

        setFormInitialKind(kind);
        setIsFormOpen(true);
      };

      const handleSaveInvoice = (newInv) => {
        setInvoices(prev => [newInv, ...prev]);
        setIsFormOpen(false);
        showToast('세금계산서가 성공적으로 등록되었습니다.');
      };

      const handleSendHometax = (invoiceId) => {
        const target = invoices.find(i => i.id === invoiceId);
        if (target) setSigningInvoice(target);
      };

      const handleCompleteSign = () => {
        if (!signingInvoice) return;
        setInvoices(prev => prev.map(inv => {
          if (inv.id === signingInvoice.id) {
            return {
              ...inv,
              status: 'hometax_sent',
              hometaxSentAt: new Date().toISOString().slice(0, 19).replace('T', ' '),
              hometaxApprovalNo: `2026102241${Date.now().toString().slice(-8)}`

          return inv;

          const matchBizNo = target.bizNumber?.includes(q);
          const matchItem = inv.items.some(it => it.name.toLowerCase().includes(q));
          return matchCompany || matchBizNo || matchItem;
        }
        return true;
      });

          {/* [AD SLOT: RIGHT WING BANNER (160x600)] 우측 윙 광고 배너 */}
          <aside aria-label="우측 광고 배너" className="hidden 2xl:block w-[160px] shrink-0 self-start sticky top-24 no-print">
            <div className="w-[160px] h-[600px] rounded-2xl border-2 border-dashed border-slate-300 bg-gradient-to-b from-slate-50 via-slate-100/70 to-slate-50 p-3.5 flex flex-col justify-between items-center text-center shadow-2xs hover:border-blue-400 transition-colors">
              <div className="w-full flex items-center justify-between pb-2 border-b border-slate-200">
                <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 bg-white px-1.5 py-0.5 rounded border border-slate-200">AD</span>
                <span className="text-[10px] font-mono text-slate-400">160 × 600</span>
              </div>
              <div className="space-y-2 py-4">
                <div className="w-10 h-10 mx-auto rounded-xl bg-slate-200/80 flex items-center justify-center text-slate-400">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                </div>
                <div className="text-xs font-bold text-slate-600">우측 윙 광고</div>
                <p className="text-[11px] text-slate-400 leading-tight">스카이스크래퍼 세로형 디스플레이 광고 영역</p>
              </div>
              <div className="w-full pt-2 border-t border-slate-200 text-[10px] text-slate-400 font-mono">AdSense / AdFit</div>
            </div>
          </aside>
        </div>

          {/* 3. 로그인 및 회원가입 모달 */}
          {authModalOpen && (
            <AuthModal
              mode={authMode}
              setMode={setAuthMode}
              onClose={() => setAuthModalOpen(false)}
              onSuccess={handleLoginSuccess}
            />
          )}

          {/* 4. 공인인증서 전자서명 모달 */}
          {signingInvoice && (
            <SigningModal
              invoice={signingInvoice}
              onClose={() => setSigningInvoice(null)}
              onConfirm={handleCompleteSign}
            />
          )}

          {/* 5. 세금계산서 표준 서식 뷰어 모달 */}
          {viewingInvoice && (
            <InvoiceViewerModal
              invoice={viewingInvoice}
              onClose={() => setViewingInvoice(null)}
            />
          )}

          {/* 토스트 알림 메시지 */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-lg shadow-xl animate-bounce">
              {toast}
            </div>
          )}

        </div>
      );
    }

    // 세금계산서 작성 서식 컴포넌트
    function InvoiceForm({ kind, myCompany, counterparties, onSave, onCancel }) {
      const [buyer, setBuyer] = useState(counterparties[0]);
      const [itemDesc, setItemDesc] = useState('');
      const [qty, setQty] = useState(1);
      const [unitPrice, setUnitPrice] = useState(0);

      const supply = Number(qty || 0) * Number(unitPrice || 0);
      const tax = Math.round(supply * 0.1);
      const grand = supply + tax;

      const handleSubmit = () => {
        if (!itemDesc.trim()) {
          alert('품목명을 입력해주세요.');
          return;
        }
        const newInvoice = {
          id: 'inv-' + Date.now(),
          manageNumber: '20261022-4100' + Math.floor(Math.random() * 89999 + 10000),
          type: 'general',
          kind: kind,
          writeDate: '2026-10-22',
          supplier: kind === 'sales' ? myCompany : buyer,
          buyer: kind === 'sales' ? buyer : myCompany,
          items: [
            {
              id: 'it-' + Date.now(),
              date: '10-22',
              name: itemDesc,
              spec: '표준',
              qty: Number(qty),
              unitPrice: Number(unitPrice),
              supplyAmount: supply,
              taxAmount: tax,
              remark: ''
            }
          ],
          totalSupplyAmount: supply,
          totalTaxAmount: tax,
          grandTotal: grand,
          cash: 0, check: 0, promissoryNote: 0, receivable: grand,
          purpose: 'claim',
          status: 'draft',
          hometaxApprovalNo: ''
        };
        onSave(newInvoice);
      };

      return (
        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-2xs space-y-6 max-w-3xl mx-auto">
          <div className="flex justify-between items-center pb-4 border-b border-slate-200">
            <h2 className="text-lg font-bold text-slate-900">
              {kind === 'sales' ? '매출 세금계산서 작성' : '매입 세금계산서 등록'}
            </h2>
            <button onClick={onCancel} className="text-slate-400 hover:text-slate-600 cursor-pointer">닫기</button>
          </div>

          <div className="grid grid-cols-2 gap-4 text-xs">
            <div>
              <label className="block text-slate-500 mb-1 font-semibold">거래처 선택</label>
              <select onChange={e => setBuyer(counterparties.find(c => c.id === e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg">
                {counterparties.map(c => <option key={c.id} value={c.id}>{c.companyName} ({c.bizNumber})</option>)}
              </select>
            </div>
            <div>
              <label className="block text-slate-500 mb-1 font-semibold">작성일자</label>
              <input type="date" defaultValue="2026-10-22" className="w-full p-2 border border-slate-300 rounded-lg" />
            </div>
          </div>

          <div className="space-y-3 text-xs">
            <h3 className="font-bold text-slate-800">품목 정보</h3>
            <div className="grid grid-cols-4 gap-3">
              <div className="col-span-2">
                <label className="block text-slate-500 mb-1">품목명</label>
                <input value={itemDesc} onChange={e => setItemDesc(e.target.value)} placeholder="예: 유지보수 컨설팅 용역" className="w-full p-2 border border-slate-300 rounded-lg" />
              </div>
              <div>
                <label className="block text-slate-500 mb-1">수량</label>
                <input type="number" value={qty} onChange={e => setQty(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg font-mono text-center" />
              </div>
              <div>
                <label className="block text-slate-500 mb-1">단가 (원)</label>
                <input type="number" value={unitPrice} onChange={e => setUnitPrice(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg font-mono text-right" />
              </div>
            </div>
          </div>

          <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
            <div>공급가액: <strong className="font-mono text-sm ml-1">₩ {formatCurrency(supply)}</strong></div>
            <div>세액 (10%): <strong className="font-mono text-sm ml-1 text-red-600">₩ {formatCurrency(tax)}</strong></div>
            <div>총 합계금액: <strong className="font-mono text-base ml-1 text-blue-700">₩ {formatCurrency(grand)}</strong></div>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button onClick={onCancel} className="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold cursor-pointer">취소</button>
            <button onClick={handleSubmit} className="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold cursor-pointer">발행 및 저장</button>
          </div>
        </div>
      );
    }

    // 인증 모달 컴포넌트
    function AuthModal({ mode, setMode, onClose, onSuccess }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [companyName, setCompanyName] = useState('');
      const [bizNumber, setBizNumber] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!email.trim() || !password.trim()) {
          alert('이메일과 비밀번호를 입력해주세요.');
          return;
        }
        if (mode === 'signup' && (!name.trim() || !companyName.trim())) {
          alert('성명과 상호명을 입력해주세요.');
          return;
        }
        onSuccess({
          id: 'user_' + Date.now(),
          email: email.trim(),
          name: mode === 'signup' ? name.trim() : email.split('@')[0],
          companyName: mode === 'signup' ? companyName.trim() : '개인 사업장',
          bizNumber: mode === 'signup' ? bizNumber.trim() : '000-00-00000',
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg cursor-pointer">×</button>
            <div className="text-center mb-5">
              <div className="w-10 h-10 bg-slate-900 text-white font-black text-xl rounded-xl flex items-center justify-center mx-auto mb-2 shadow-xs">T</div>
              <h3 className="text-lg font-black text-slate-900">{mode === 'login' ? 'TaxOne 로그인' : '신규 회원가입'}</h3>
              <p className="text-xs text-slate-500 mt-0.5">{mode === 'login' ? '등록된 계정으로 로그인하세요.' : '새로운 사업자 계정을 생성합니다.'}</p>
            </div>
            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              {mode === 'signup' && (
                <>
                  <div>
                    <label className="block text-slate-600 font-semibold mb-1">성명 (대표자)</label>
                    <input type="text" required value={name} onChange={e => setName(e.target.value)} placeholder="홍길동" className="w-full p-2.5 border border-slate-300 rounded-xl" />
                  </div>
                  <div>
                    <label className="block text-slate-600 font-semibold mb-1">상호 또는 법인명</label>
                    <input type="text" required value={companyName} onChange={e => setCompanyName(e.target.value)} placeholder="(주)텍스원" className="w-full p-2.5 border border-slate-300 rounded-xl" />
                  </div>
                  <div>
                    <label className="block text-slate-600 font-semibold mb-1">사업자등록번호 (선택)</label>
                    <input type="text" value={bizNumber} onChange={e => setBizNumber(e.target.value)} placeholder="000-00-00000" className="w-full p-2.5 border border-slate-300 rounded-xl font-mono" />
                  </div>
                </>
              )}
              <div>
                <label className="block text-slate-600 font-semibold mb-1">이메일 주소</label>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="user@example.com" className="w-full p-2.5 border border-slate-300 rounded-xl" />
              </div>
              <div>
                <label className="block text-slate-600 font-semibold mb-1">비밀번호</label>
                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" className="w-full p-2.5 border border-slate-300 rounded-xl" />
              </div>
              <button type="submit" className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs cursor-pointer transition-colors mt-2">
                {mode === 'login' ? '로그인' : '회원가입 완료'}
              </button>
            </form>
            <div className="mt-4 pt-3 border-t border-slate-200 text-center text-xs text-slate-500">
              {mode === 'login' ? (
                <div>아직 계정이 없으신가요? <button onClick={() => setMode('signup')} className="text-slate-900 font-bold hover:underline cursor-pointer">회원가입</button></div>
              ) : (
                <div>이미 계정이 있으신가요? <button onClick={() => setMode('login')} className="text-slate-900 font-bold hover:underline cursor-pointer">로그인</button></div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // 전자서명 모달 컴포넌트
    function SigningModal({ invoice, onClose, onConfirm }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div className="flex items-center gap-3 pb-3 border-b border-slate-200">
              <div className="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold">🔐</div>
              <div>
                <h3 className="font-bold text-slate-900 text-sm">공인인증서 전자서명 및 국세청 전송</h3>
                <p className="text-[11px] text-slate-400">부가가치세법 규정에 따라 공인인증기관 PKI 전자서명을 수행합니다.</p>
              </div>
            </div>
            <div className="bg-slate-50 p-4 rounded-xl text-xs space-y-1.5 border border-slate-200">
              <div className="flex justify-between"><span className="text-slate-500">대상 문서:</span><span className="font-bold text-slate-800">{invoice.items[0]?.name}</span></div>
              <div className="flex justify-between"><span className="text-slate-500">합계 금액:</span><span className="font-mono font-bold text-slate-900">₩ {formatCurrency(invoice.grandTotal)}</span></div>
              <div className="flex justify-between"><span className="text-slate-500">공급받는자:</span><span>{invoice.buyer?.companyName}</span></div>
            </div>
            <div className="flex justify-end gap-2 pt-2">
              <button onClick={onClose} className="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold cursor-pointer">취소</button>
              <button onClick={onConfirm} className="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold cursor-pointer">인증서 전자서명 및 즉시 전송</button>
            </div>
          </div>
        </div>
      );
    }

    // 세금계산서 상세 서식 뷰어 모달
    function InvoiceViewerModal({ invoice, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
          <div id="printable-modal" className="bg-white rounded-2xl max-w-3xl w-full p-6 md:p-8 my-8 shadow-2xl relative">
            <div className="no-print flex justify-between items-center pb-4 border-b border-slate-200 mb-6">
              <span className="px-2.5 py-1 text-xs font-bold rounded bg-slate-100 text-slate-800">국세청 별지 제11호 서식 표준</span>
              <div className="flex gap-2">
                <button onClick={() => window.print()} className="px-3.5 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-bold cursor-pointer">인쇄 / PDF 저장</button>
                <button onClick={onClose} className="px-3.5 py-1.5 border border-slate-300 rounded-lg text-xs font-semibold cursor-pointer">닫기</button>
              </div>
            </div>
            <div className="border-2 border-red-500 p-4 rounded-lg bg-white">
              <div className="text-center pb-3 border-b-2 border-red-500">
                <h1 className="text-2xl font-black tracking-widest text-red-600">세 금 계 산 서</h1>
                <span className="text-xs text-red-500">({invoice.kind === 'sales' ? '공급자 보관용' : '공급받는자 보관용'})</span>
              </div>
              <div className="grid grid-cols-2 divide-x-2 divide-red-500 border-b-2 border-red-500 text-xs">
                <div className="p-3 space-y-1">
                  <div className="font-bold text-red-600 mb-1">[ 공 급 자 ]</div>
                  <div><strong>등록번호:</strong> <span className="font-mono">{invoice.supplier?.bizNumber || '-'}</span></div>
                  <div><strong>상호:</strong> {invoice.supplier?.companyName || '-'}</div>
                  <div><strong>성명:</strong> {invoice.supplier?.ceoName || '-'}</div>
                  <div><strong>주소:</strong> {invoice.supplier?.address || '-'}</div>
                </div>
                <div className="p-3 space-y-1">
                  <div className="font-bold text-blue-600 mb-1">[ 공급받는자 ]</div>
                  <div><strong>등록번호:</strong> <span className="font-mono">{invoice.buyer?.bizNumber || '-'}</span></div>
                  <div><strong>상호:</strong> {invoice.buyer?.companyName || '-'}</div>
                  <div><strong>성명:</strong> {invoice.buyer?.ceoName || '-'}</div>
                  <div><strong>주소:</strong> {invoice.buyer?.address || '-'}</div>
                </div>
              </div>
              <div className="p-3 bg-red-50 flex justify-between items-center text-xs font-bold text-red-900 mt-2 rounded">
                <div>합계금액: <span className="text-base font-mono font-black ml-1 text-red-600">₩ {formatCurrency(invoice.grandTotal)}</span></div>
                <div>공급가액: <span className="font-mono ml-1">₩ {formatCurrency(invoice.totalSupplyAmount)}</span></div>
                <div>세액: <span className="font-mono ml-1">₩ {formatCurrency(invoice.totalTaxAmount)}</span></div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
