<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Tax 전자세금계산서 - 국세청 표준 전자세금계산서 및 23종 세무계산 포털</title>
  <meta name="description" content="국세청 표준 규격 전자세금계산서 실시간 작성, 매출/매입 관리대장, 2026 최신 23종 세무계산기 및 실무 세무 가이드 솔루션" />
  <meta name="robots" content="index, follow" />

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1573419461895141" crossorigin="anonymous"></script>

  <!-- Fonts & Tailwind CSS CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '"Noto Sans KR"', 'Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #1e293b; letter-spacing: -0.015em; }
    @media print {
      body * { visibility: hidden; }
      #printable-invoice, #printable-invoice * { visibility: visible; }
      #printable-invoice { position: absolute; left: 0; top: 0; width: 100%; border: none !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const icons = {
        receipt: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z" />,
        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
        shield: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />,
        lock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 08-8 0v4h8z" />,
        checkCircle: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />,
        zap: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />,
        chart: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />,
        calculator: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />,
        wallet: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />,
        coins: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />,
        clipboardList: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />,
        external: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />,
        printer: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />,
      };
      return (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          {icons[name] || icons.receipt}
        </svg>
      );
    };

    const formatCurrency = (val) => Number(val || 0).toLocaleString();

    const CALC_CATEGORIES = [
      { id: 'all', name: '전체 (23)' },
      { id: 'tax', name: '소득세·국세 8' },
      { id: 'salary', name: '근로·연봉·월급 5' },
      { id: 'insurance', name: '4대보험·건강보험 2' },
      { id: 'asset', name: '자산·양도·주식 8' },
    ];

    const ALL_CALCULATORS = [
      { id: 'c1', category: 'tax', name: '근로소득세', icon: 'calculator', bg: 'bg-orange-500' },
      { id: 'c3', category: 'tax', name: '법인세', icon: 'clipboardList', bg: 'bg-blue-600' },
      { id: 'c4', category: 'tax', name: '종합소득세', icon: 'chart', bg: 'bg-slate-900' },
      { id: 'c18', category: 'salary', name: '연봉 계산기', icon: 'chart', bg: 'bg-blue-600' },
      { id: 'c20', category: 'salary', name: '월급 계산기', icon: 'wallet', bg: 'bg-emerald-600' },
      { id: 'c22', category: 'salary', name: '퇴직금 계산기', icon: 'coins', bg: 'bg-orange-600' },
      { id: 'c2', category: 'insurance', name: '4대보험', icon: 'zap', bg: 'bg-rose-500' },
      { id: 'c7', category: 'asset', name: '양도소득세', icon: 'clipboardList', bg: 'bg-indigo-600' },
    ];

    // 세무 계산기 허브 컴포넌트
    function TaxCalculatorHub() {
      const [activeCategory, setActiveCategory] = useState('all');
      const [calcMode, setCalcMode] = useState('annual');
      const [amount, setAmount] = useState(45000000);

      const quickResult = useMemo(() => {
        const gross = calcMode === 'annual' ? Math.floor(amount / 12) : Number(amount) || 0;
        const nonTaxable = 200000;
        const taxable = Math.max(0, gross - nonTaxable);
        const nationalPension = Math.floor(Math.min(Math.max(taxable, 390000), 6170000) * 0.045);
        const healthInsurance = Math.floor(taxable * 0.03545);
        const longTermCare = Math.floor(healthInsurance * 0.1295);
        const employmentInsurance = Math.floor(taxable * 0.009);
        const estimatedTax = Math.floor(taxable * 0.032);
        const localIncomeTax = Math.floor(estimatedTax * 0.1);
        const totalDeduction = nationalPension + healthInsurance + longTermCare + employmentInsurance + estimatedTax + localIncomeTax;
        const netPay = gross - totalDeduction;

        return { gross, nationalPension, healthInsurance, longTermCare, employmentInsurance, totalTax: estimatedTax + localIncomeTax, totalDeduction, netPay };
      }, [calcMode, amount]);

      return (
        <div className="space-y-6">
          <div className="bg-[#0b1329] text-white rounded-2xl p-6 md:p-8 shadow-xl space-y-6">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-800">
              <div className="flex items-start gap-3">
                <div className="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 flex items-center justify-center shrink-0 mt-0.5">
                  <Icon name="zap" className="w-5 h-5" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h3 className="text-base sm:text-lg font-bold">30초 실시간 월급 실수령액 간이 계산기</h3>
                    <span className="px-2 py-0.5 rounded text-[10px] font-black bg-emerald-500 text-slate-950 uppercase tracking-wider">Quick</span>
                  </div>
                  <p className="text-xs text-slate-400 mt-0.5">숫자만 입력하면 4대보험과 세금이 즉각 계산되어 통장에 찍히는 월 실수령액이 산출됩니다.</p>
                </div>
              </div>
              <div className="flex items-center bg-slate-900 p-1 rounded-xl border border-slate-800 shrink-0 text-xs">
                <button
                  type="button"
                  onClick={() => { setCalcMode('annual'); setAmount(45000000); }}
                  className={`px-4 py-2 rounded-lg font-bold transition-all cursor-pointer ${calcMode === 'annual' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-400 hover:text-white'}`}
                >
                  연봉 기준
                </button>
                <button
                  type="button"
                  onClick={() => { setCalcMode('monthly'); setAmount(3750000); }}
                  className={`px-4 py-2 rounded-lg font-bold transition-all cursor-pointer ${calcMode === 'monthly' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-400 hover:text-white'}`}
                >
                  월급 기준
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
              <div className="lg:col-span-5 space-y-4">
                <div className="flex justify-between items-center text-xs">
                  <span className="text-slate-300 font-medium">{calcMode === 'annual' ? '연봉 금액 (세전)' : '월 급여 (세전)'}</span>
                  <span className="text-slate-400 font-mono">월 환산 약 <strong className="text-white">₩ {formatCurrency(quickResult.gross)}</strong></span>
                </div>
                <div className="bg-slate-900/90 border border-slate-700/80 rounded-xl p-3.5 flex items-center shadow-inner">
                  <span className="text-emerald-400 font-mono font-bold text-lg mr-2">₩</span>
                  <input
                    type="number"
                    value={amount}
                    onChange={(e) => setAmount(Number(e.target.value))}
                    className="w-full bg-transparent text-white font-mono font-bold text-xl focus:outline-none"
                  />
                </div>
              </div>
              <div className="lg:col-span-7 bg-slate-900/90 border border-slate-800 rounded-2xl p-5 md:p-6 space-y-4">
                <div className="flex justify-between items-center text-xs text-slate-400">
                  <span>예상 월 실수령액</span>
                  <span>총 공제액: - ₩ {formatCurrency(quickResult.totalDeduction)}</span>
                </div>
                <div className="text-3xl sm:text-4xl font-black font-mono text-emerald-400">
                  ₩ {formatCurrency(quickResult.netPay)}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 사업자 설정 뷰 컴포넌트
    function CompanySettingsView({ company, onSave }) {
      const [formData, setFormData] = useState(company);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(formData);
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="border-b pb-4 border-slate-200">
            <h1 className="text-2xl font-bold text-slate-900">사업자 정보 및 환경 설정</h1>
            <p className="text-sm text-slate-500 mt-1">기본 사업자 정보를 설정하고 브라우저 저장소에 보관합니다.</p>
          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-6 md:p-8">
            <form onSubmit={handleSubmit} className="space-y-5 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block font-bold text-slate-700 mb-1">사업자등록번호</label>
                  <input
                    type="text"
                    name="bizNumber"
                    value={formData.bizNumber}
                    onChange={handleChange}
                    className="w-full border border-slate-300 rounded-lg p-2.5 font-mono"
                  />
                </div>
                <div>
                  <label className="block font-bold text-slate-700 mb-1">상호(법인명)</label>
                  <input
                    type="text"
                    name="companyName"
                    value={formData.companyName}
                    onChange={handleChange}
                    className="w-full border border-slate-300 rounded-lg p-2.5"
                  />
                </div>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block font-bold text-slate-700 mb-1">대표자 성명</label>
                  <input
                    type="text"
                    name="ceoName"
                    value={formData.ceoName}
                    onChange={handleChange}
                    className="w-full border border-slate-300 rounded-lg p-2.5"
                  />
                </div>
                <div>
                  <label className="block font-bold text-slate-700 mb-1">이메일</label>
                  <input
                    type="email"
                    name="email"
                    value={formData.email}
                    onChange={handleChange}
                    className="w-full border border-slate-300 rounded-lg p-2.5 font-mono"
                  />
                </div>
              </div>
              <div>
                <label className="block font-bold text-slate-700 mb-1">사업장 기본 주소</label>
                <input
                  type="text"
                  name="address"
                  value={formData.address}
                  onChange={handleChange}
                  className="w-full border border-slate-300 rounded-lg p-2.5"
                />
              </div>
              <div className="flex justify-end pt-4 border-t">
                <button
                  type="submit"
                  className="bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs px-5 py-2.5 rounded-lg cursor-pointer"
                >
                  사업자 정보 변경 저장
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // 메인 앱 컴포넌트
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');

      const [myCompany, setMyCompany] = useState(() => {
        const saved = localStorage.getItem('premium_tax_company');
        return saved ? JSON.parse(saved) : {
          companyName: '(주)프리미엄텍스',
          bizNumber: '123-45-67890',
          ceoName: '홍길동',
          address: '서울특별시 영등포구 여의대로 108',
          email: 'tax@company.com'
        };
      });

      const handleSaveCompany = (updated) => {
        setMyCompany(updated);
        localStorage.setItem('premium_tax_company', JSON.stringify(updated));
        alert('사업자 정보가 로컬 저장소에 저장되었습니다.');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
          <header className="sticky top-0 z-40 bg-white border-b border-slate-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between gap-8 h-16">
                <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                  <div className="w-9 h-9 rounded-lg bg-slate-900 text-white flex items-center justify-center font-bold">
                    <Icon name="receipt" className="w-5 h-5 text-emerald-400" />
                  </div>
                  <span className="text-lg font-bold tracking-tight text-slate-900">Premium Tax 전자세금계산서</span>
                </div>

                <nav className="hidden md:flex items-center gap-6 text-xs font-medium text-slate-600">
                  <button onClick={() => setActiveTab('dashboard')} className={`py-1 cursor-pointer ${activeTab === 'dashboard' ? 'text-slate-900 font-bold border-b-2 border-slate-900' : ''}`}>종합 대시보드</button>
                  <button onClick={() => setActiveTab('calculator')} className={`py-1 cursor-pointer ${activeTab === 'calculator' ? 'text-emerald-700 font-bold border-b-2 border-emerald-600' : ''}`}>세무 계산기</button>
                  <button onClick={() => setActiveTab('settings')} className={`py-1 cursor-pointer ${activeTab === 'settings' ? 'text-slate-900 font-bold border-b-2 border-slate-900' : ''}`}>사업자 설정</button>
                </nav>

                <div className="flex items-center gap-2.5"></div>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
                  <div className="lg:col-span-12 bg-gradient-to-r from-slate-900 via-slate-800 to-indigo-950 text-white rounded-2xl p-6 sm:p-7 shadow-md flex flex-col justify-between space-y-6">
                    <div className="space-y-2">
                      <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-medium border border-emerald-500/30">
                        <Icon name="shield" className="w-3.5 h-3.5" />
                        <span>국세청 표준 전자세금계산서 발행 및 세무 포털</span>
                      </div>
                      <h2 className="text-xl sm:text-2xl font-bold tracking-tight">스마트 전자세금계산서 및 23종 세무 포털</h2>
                      <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                        실시간 세금계산서 작성 및 23종 세무 계산 기능을 제공하는 전문 솔루션입니다.
                      </p>
                    </div>
                  </div>
                </div>
                <TaxCalculatorHub />
              </div>
            )}

            {activeTab === 'calculator' && <TaxCalculatorHub />}

            {activeTab === 'settings' && <CompanySettingsView company={myCompany} onSave={handleSaveCompany} />}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
